# Pinned production values for kube-prometheus-stack 87.18.1.
# The release name and all component names deliberately use the generic
# Prometheus/Grafana vocabulary rather than a Ray-specific name.
fullnameOverride: prometheus

global:
  # All non-public platform images are pulled from the tenant Harbor project.
  # The deploy script copies this pull secret into the monitoring namespace.
  imagePullSecrets:
    - name: harbor-registry

crds:
  enabled: true
  # Disable the optional CRD upgrade hook: it introduces a separate GHCR image
  # and is unnecessary for this first, pinned installation.
  upgradeJob:
    enabled: false

defaultRules:
  create: true

prometheusOperator:
  # kube-prometheus-stack intentionally renders one restart-safe operator.
  # The Prometheus, Alertmanager, and Grafana data plane is deployed HA below.
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values: [virtual-node]
              - key: type
                operator: NotIn
                values: [virtual-kubelet]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: platform.wellspiking.ai/pool
                operator: In
                values: [control-plane]
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    registry: harbor.wellspiking.ai
    repository: guofeng.su/prometheus-operator
    tag: v0.92.1
    sha: 7d9247d2351480fc74587e24681578f815f387bafb2ee7b86a852a94c4cd3774
  prometheusConfigReloader:
    image:
      registry: harbor.wellspiking.ai
      repository: guofeng.su/prometheus-config-reloader
      tag: v0.92.1
      sha: 74550ba3e8bf93f47bc574231090d340ae9c01d25cd11ff74799e65f9fdb9a48
  thanosImage:
    registry: harbor.wellspiking.ai
    repository: guofeng.su/thanos
    tag: v0.42.2
    sha: 6249f7aaadd3695df637fb2eb4cb9a9955611eee691c3970892fe9c0dc3f2db6
  admissionWebhooks:
    # Keep the standard validation webhook enabled in production. Its patch
    # image is mirrored into the internal Harbor project below.
    enabled: true
    patch:
      enabled: true
      image:
        registry: harbor.wellspiking.ai
        repository: guofeng.su/kube-webhook-certgen
        tag: 1.8.4
        sha: 76a2170cd0c9a7758c4ac8ac5bbe9b6f73e869a15ffb77d9f684664f7d7b96b1

prometheus:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  prometheusSpec:
    nodeSelector: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: NotIn
                  values: [virtual-node]
                - key: type
                  operator: NotIn
                  values: [virtual-kubelet]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: platform.wellspiking.ai/pool
                  operator: In
                  values: [control-plane]
    image:
      registry: harbor.wellspiking.ai
      repository: guofeng.su/prometheus
      tag: v3.13.1-distroless
      sha: 214f8427c8fba80c327bb94a75feb802ae12f2d6ca30812aa6e7d22f09bbea80
    replicas: 2
    retention: 15d
    retentionSize: 45GiB
    scrapeInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podAntiAffinity: hard
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 6Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ebs-ssd
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  enabled: true
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  alertmanagerSpec:
    nodeSelector: {}
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node.kubernetes.io/instance-type
                  operator: NotIn
                  values: [virtual-node]
                - key: type
                  operator: NotIn
                  values: [virtual-kubelet]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: platform.wellspiking.ai/pool
                  operator: In
                  values: [control-plane]
    image:
      registry: harbor.wellspiking.ai
      repository: guofeng.su/alertmanager
      tag: v0.33.1
      sha: 9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    replicas: 2
    podAntiAffinity: hard
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

grafana:
  enabled: true
  replicas: 2
  nodeSelector: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values: [virtual-node]
              - key: type
                operator: NotIn
                values: [virtual-kubelet]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: platform.wellspiking.ai/pool
                operator: In
                values: [control-plane]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: prometheus
          topologyKey: kubernetes.io/hostname
  podDisruptionBudget:
    minAvailable: 1
  image:
    registry: harbor.wellspiking.ai
    repository: hub/grafana/grafana
    tag: 13.1.1
    sha: 7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  sidecar:
    image:
      registry: harbor.wellspiking.ai
      repository: guofeng.su/k8s-sidecar
      tag: 2.8.1
      sha: abb55b2165c60e8f97e473862c7a3123df6f67d44f592949577c29b8fb2df9d6
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      uid: prometheus
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

kube-state-metrics:
  image:
    registry: harbor.wellspiking.ai
    repository: guofeng.su/kube-state-metrics
    tag: v2.19.1
    sha: sha256:f6e5dc7c1193809dd59aad3f391eb7df72c18723f8dd505928d6f6152a93e4d3

prometheus-node-exporter:
  image:
    registry: harbor.wellspiking.ai
    repository: guofeng.su/node-exporter
    tag: v1.12.1
    digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
