# Native Collector listeners use loopback. Only this proxy binds the Pod IP.
# Replace __POD_IP__ from the downward API before starting the pinned Envoy.
static_resources:
  listeners:
    - name: otlp_grpc
      address:
        socket_address: {address: __POD_IP__, port_value: 4317}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_params: {tls_minimum_protocol_version: TLSv1_2}
                alpn_protocols: [h2]
                tls_certificates:
                  - certificate_chain: {filename: /etc/obs-mtls/tls.crt}
                    private_key: {filename: /etc/obs-mtls/tls.key}
                validation_context:
                  trusted_ca: {filename: /etc/obs-mtls/ca.crt}
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher: {exact: "spiffe://observability.raytrain.local/observability-otel/canary"}
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: otlp_grpc
                cluster: collector_grpc
                idle_timeout: 300s
    - name: otlp_http
      address:
        socket_address: {address: __POD_IP__, port_value: 4318}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_params: {tls_minimum_protocol_version: TLSv1_2}
                alpn_protocols: [h2, http/1.1]
                tls_certificates:
                  - certificate_chain: {filename: /etc/obs-mtls/tls.crt}
                    private_key: {filename: /etc/obs-mtls/tls.key}
                validation_context:
                  trusted_ca: {filename: /etc/obs-mtls/ca.crt}
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher: {exact: "spiffe://observability.raytrain.local/observability-otel/canary"}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: otlp_http
                codec_type: AUTO
                stream_idle_timeout: 60s
                route_config:
                  name: otlp_http
                  virtual_hosts:
                    - name: canary_signals
                      domains: ["*"]
                      routes:
                        - match:
                            path: /v1/logs
                            headers: [{name: ":method", string_match: {exact: POST}}]
                          route: {cluster: collector_http, timeout: 30s}
                        - match:
                            path: /v1/traces
                            headers: [{name: ":method", string_match: {exact: POST}}]
                          route: {cluster: collector_http, timeout: 30s}
                        - match: {prefix: /}
                          direct_response: {status: 404}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: collector_metrics
      address:
        socket_address: {address: __POD_IP__, port_value: 8888}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_params: {tls_minimum_protocol_version: TLSv1_2}
                alpn_protocols: [h2, http/1.1]
                tls_certificates:
                  - certificate_chain: {filename: /etc/obs-mtls/tls.crt}
                    private_key: {filename: /etc/obs-mtls/tls.key}
                validation_context:
                  trusted_ca: {filename: /etc/obs-mtls/ca.crt}
                  match_typed_subject_alt_names:
                    - san_type: URI
                      matcher: {exact: "spiffe://observability.raytrain.local/observability-metrics/vmagent"}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: collector_metrics
                codec_type: AUTO
                stream_idle_timeout: 30s
                route_config:
                  name: collector_metrics
                  virtual_hosts:
                    - name: metrics_only
                      domains: ["*"]
                      routes:
                        - match:
                            path: /metrics
                            headers: [{name: ":method", string_match: {exact: GET}}]
                          route: {cluster: collector_metrics, timeout: 15s}
                        - match: {prefix: /}
                          direct_response: {status: 404}
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    # Kubelet cannot present an application certificate. This listener returns
    # status only; it never forwards a request body or the Collector health body.
    - name: health_status_only
      address:
        socket_address: {address: __POD_IP__, port_value: 18080}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: health_status_only
                codec_type: HTTP1
                stream_idle_timeout: 5s
                route_config:
                  name: health_status_only
                  virtual_hosts:
                    - name: health_status_only
                      domains: ["*"]
                      routes:
                        - match: {prefix: /}
                          direct_response: {status: 404}
                http_filters:
                  - name: envoy.filters.http.health_check
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck
                      pass_through_mode: false
                      headers:
                        - name: ":path"
                          string_match:
                            safe_regex: {google_re2: {}, regex: "^/(readyz|livez)$"}
                        - name: ":method"
                          string_match: {exact: GET}
                      cluster_min_healthy_percentages:
                        collector_health: {value: 100}
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: collector_grpc
      connect_timeout: 2s
      type: STATIC
      load_assignment:
        cluster_name: collector_grpc
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 4317}
    - name: collector_http
      connect_timeout: 2s
      type: STATIC
      load_assignment:
        cluster_name: collector_http
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 4318}
    - name: collector_metrics
      connect_timeout: 2s
      type: STATIC
      load_assignment:
        cluster_name: collector_metrics
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 8888}
    - name: collector_health
      connect_timeout: 1s
      type: STATIC
      health_checks:
        - timeout: 1s
          interval: 5s
          # This cluster never carries routed requests; Envoy otherwise
          # overrides interval with its 60s no-traffic default.
          no_traffic_interval: 5s
          unhealthy_threshold: 2
          healthy_threshold: 1
          http_health_check: {path: /}
      load_assignment:
        cluster_name: collector_health
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: 127.0.0.1, port_value: 13133}
