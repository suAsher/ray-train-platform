# Collector Contrib 0.162.0. Canary and authenticated production HTTP remain separate.
extensions:
  health_check:
    endpoint: 127.0.0.1:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true
    fsync: true
    max_size: 2147483648
    # Never silently start a new queue after a corruption.
    recreate: false
    compaction:
      on_rebound: true
      directory: /var/lib/otelcol/compaction
      rebound_needed_threshold_mib: 256
      rebound_trigger_threshold_mib: 64
receivers:
  otlp/canary:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
        max_recv_msg_size_mib: 4
      http:
        endpoint: 127.0.0.1:4318
        max_request_body_size: 4194304
  otlp/platform:
    protocols:
      http:
        endpoint: 127.0.0.1:14318
        max_request_body_size: 1048576
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 128
  transform/canary:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
      - context: span
        statements:
          - keep_keys(attributes, ["canary.run_id", "canary.sequence", "canary.marker"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
      - context: log
        statements:
          - keep_keys(attributes, ["canary.run_id", "canary.sequence", "canary.marker"])
  resource/canary:
    attributes:
      - {key: service.name, value: observability-canary, action: upsert}
      - {key: service.namespace, value: opentelemetry, action: upsert}
      - {key: k8s.cluster.name, value: raytrain-vke, action: upsert}
      - {key: deployment.environment.name, value: observability-canary, action: upsert}
      - {key: raytrain.telemetry.source, value: synthetic-canary, action: upsert}
  # Wrong types or processor errors fail closed; no arbitrary free text survives.
  filter/platform:
    error_mode: propagate
    traces:
      span:
        - 'resource.attributes["service.name"] != "ray-train-backend"'
        - 'kind != SPAN_KIND_SERVER'
        - 'not IsString(attributes["http.request.method"])'
        - 'not IsMatch(attributes["http.request.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE|OTHER)$")'
        - 'not IsString(attributes["http.route"])'
        - 'Len(attributes["http.route"]) > 256'
        - 'not IsMatch(attributes["http.route"], "^(unmatched|/[-A-Za-z0-9_/:.*]*)$")'
        - 'not IsInt(attributes["http.response.status_code"])'
        - 'attributes["http.response.status_code"] < 100 or attributes["http.response.status_code"] > 599'
    logs:
      log_record:
        - 'resource.attributes["service.name"] != "ray-train-backend"'
        - 'body != "http.request.completed"'
        - 'not IsString(attributes["http.request.method"])'
        - 'not IsMatch(attributes["http.request.method"], "^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS|CONNECT|TRACE|OTHER)$")'
        - 'not IsString(attributes["http.route"])'
        - 'Len(attributes["http.route"]) > 256'
        - 'not IsMatch(attributes["http.route"], "^(unmatched|/[-A-Za-z0-9_/:.*]*)$")'
        - 'not IsInt(attributes["http.response.status_code"])'
        - 'attributes["http.response.status_code"] < 100 or attributes["http.response.status_code"] > 599'
        - 'not IsInt(attributes["duration_ms"])'
        - 'attributes["duration_ms"] < 0 or attributes["duration_ms"] > 86400000'
  transform/platform:
    error_mode: propagate
    trace_statements:
      - context: span
        statements:
          - keep_keys(resource.attributes, [])
          - keep_keys(instrumentation_scope.attributes, [])
          - set(instrumentation_scope.name, "")
          - set(instrumentation_scope.version, "")
          - keep_keys(attributes, ["http.request.method", "http.route", "http.response.status_code"])
          - set(name, Concat([attributes["http.request.method"], attributes["http.route"]], " "))
          - set(status.message, "")
          - set(trace_state, "")
          - set(events, [])
          - set(links, [])
    log_statements:
      - context: log
        statements:
          - keep_keys(resource.attributes, [])
          - keep_keys(instrumentation_scope.attributes, [])
          - set(instrumentation_scope.name, "")
          - set(instrumentation_scope.version, "")
          - keep_keys(attributes, ["http.request.method", "http.route", "http.response.status_code", "duration_ms"])
          - set(body, "http.request.completed")
          - set(severity_text, "INFO")
          - set(severity_number, SEVERITY_NUMBER_INFO)
          - set(event_name, "http.request.completed")
  resource/platform:
    attributes:
      - {key: service.name, value: ray-train-backend, action: upsert}
      - {key: service.namespace, value: ray-train-platform, action: upsert}
      - {key: k8s.cluster.name, value: raytrain-vke, action: upsert}
      - {key: deployment.environment.name, value: production, action: upsert}
      - {key: raytrain.telemetry.source, value: production, action: upsert}
exporters:
  clickhouse/canary:
    endpoint: tcp://clickhouse-clickhouse.clickhouse.svc.cluster.local:9440
    username: otel_ingest
    password: ${env:CLICKHOUSE_PASSWORD}
    database: observability_canary
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    create_schema: false
    async_insert: true
    connection_params:
      wait_for_async_insert: "1"
      async_insert_busy_timeout_ms: "1000"
    tls:
      ca_file: /etc/obs-mtls/ca.crt
      cert_file: /etc/obs-mtls/tls.crt
      key_file: /etc/obs-mtls/tls.key
      server_name_override: clickhouse-clickhouse.clickhouse.svc.cluster.local
      min_version: "1.2"
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 104857600
      num_consumers: 2
      wait_for_result: false
      block_on_overflow: false
      batch:
        sizer: items
        min_size: 1000
        max_size: 4000
        flush_timeout: 1s
  clickhouse/platform:
    endpoint: tcp://clickhouse-clickhouse.clickhouse.svc.cluster.local:9440
    username: platform_otel_ingest
    password: ${env:PLATFORM_CLICKHOUSE_PASSWORD}
    database: raytrain_observability
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    create_schema: false
    async_insert: true
    connection_params:
      wait_for_async_insert: "1"
      async_insert_busy_timeout_ms: "1000"
    tls:
      ca_file: /etc/obs-mtls/ca.crt
      cert_file: /etc/obs-mtls/tls.crt
      key_file: /etc/obs-mtls/tls.key
      server_name_override: clickhouse-clickhouse.clickhouse.svc.cluster.local
      min_version: "1.2"
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 104857600
      num_consumers: 2
      wait_for_result: false
      block_on_overflow: false
      batch:
        sizer: items
        min_size: 128
        max_size: 512
        flush_timeout: 1s
service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    logs/canary:
      receivers: [otlp/canary]
      processors: [memory_limiter, transform/canary, resource/canary]
      exporters: [clickhouse/canary]
    traces/canary:
      receivers: [otlp/canary]
      processors: [memory_limiter, transform/canary, resource/canary]
      exporters: [clickhouse/canary]
    logs/platform:
      receivers: [otlp/platform]
      processors: [memory_limiter, filter/platform, transform/platform, resource/platform]
      exporters: [clickhouse/platform]
    traces/platform:
      receivers: [otlp/platform]
      processors: [memory_limiter, filter/platform, transform/platform, resource/platform]
      exporters: [clickhouse/platform]
