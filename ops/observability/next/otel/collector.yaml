# Collector Contrib 0.162.0. Synthetic canary data only in this phase.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage/queue:
    directory: /var/lib/otelcol/queue
    create_directory: true
    fsync: true
    max_size: 2147483648
    # Never silently start a new queue after a corruption.
    recreate: false
    compaction:
      on_rebound: true
      directory: /var/lib/otelcol/compaction
      rebound_needed_threshold_mib: 256
      rebound_trigger_threshold_mib: 64
receivers:
  otlp/canary:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 4
        tls:
          cert_file: /etc/otelcol/tls/tls.crt
          key_file: /etc/otelcol/tls/tls.key
          client_ca_file: /etc/otelcol/tls/ca.crt
          min_version: "1.2"
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 4194304
        tls:
          cert_file: /etc/otelcol/tls/tls.crt
          key_file: /etc/otelcol/tls/tls.key
          client_ca_file: /etc/otelcol/tls/ca.crt
          min_version: "1.2"
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 128
  transform/canary:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
      - context: span
        statements:
          - keep_keys(attributes, ["canary.run_id", "canary.sequence", "canary.marker"])
    log_statements:
      - context: resource
        statements:
          - keep_keys(attributes, [])
      - context: log
        statements:
          - keep_keys(attributes, ["canary.run_id", "canary.sequence", "canary.marker"])
  resource/canary:
    attributes:
      - {key: service.name, value: observability-canary, action: upsert}
      - {key: service.namespace, value: observability-otel, action: upsert}
      - {key: k8s.cluster.name, value: raytrain-vke, action: upsert}
      - {key: deployment.environment.name, value: observability-canary, action: upsert}
      - {key: raytrain.telemetry.source, value: synthetic-canary, action: upsert}
exporters:
  clickhouse/canary:
    endpoint: tcp://clickhouse-observability.observability-analytics.svc.cluster.local:9440
    username: otel_ingest
    password: ${env:CLICKHOUSE_PASSWORD}
    database: observability_canary
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    create_schema: false
    async_insert: true
    connection_params:
      wait_for_async_insert: "1"
      async_insert_busy_timeout_ms: "1000"
    tls:
      ca_file: /etc/otelcol/clickhouse-ca/ca.crt
      server_name_override: clickhouse-observability.observability-analytics.svc.cluster.local
      min_version: "1.2"
    timeout: 15s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue:
      enabled: true
      storage: file_storage/queue
      sizer: bytes
      queue_size: 104857600
      num_consumers: 2
      wait_for_result: false
      block_on_overflow: false
      batch:
        sizer: items
        min_size: 1000
        max_size: 4000
        flush_timeout: 1s
service:
  extensions: [health_check, file_storage/queue]
  telemetry:
    logs:
      level: info
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs/canary:
      receivers: [otlp/canary]
      processors: [memory_limiter, transform/canary, resource/canary]
      exporters: [clickhouse/canary]
    traces/canary:
      receivers: [otlp/canary]
      processors: [memory_limiter, transform/canary, resource/canary]
      exporters: [clickhouse/canary]
