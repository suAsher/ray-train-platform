apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-gateway
  namespace: observability-otel
spec:
  podSelector:
    matchLabels: {observability.raytrain.io/component: otel-gateway}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: otel-canary}
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability-metrics}
      ports:
        - {protocol: TCP, port: 8888}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: observability-analytics}
          podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse}
      ports:
        - {protocol: TCP, port: 9440}
