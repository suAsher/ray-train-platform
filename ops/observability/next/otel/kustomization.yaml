apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: opentelemetry
resources:
  - gateway.yaml
  - network-policy.yaml
configMapGenerator:
  - name: otel-gateway-config
    files: [collector.yaml]
  - name: otel-gateway-proxy
    files: [proxy-otel.yaml]
generatorOptions:
  disableNameSuffixHash: true
