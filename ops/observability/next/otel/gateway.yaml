apiVersion: v1
kind: Service
metadata:
  name: otel-gateway-headless
  namespace: opentelemetry
spec:
  clusterIP: None
  selector: {observability.raytrain.io/component: otel-gateway}
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-gateway
  namespace: opentelemetry
  labels: {observability.raytrain.io/component: otel-gateway}
spec:
  type: ClusterIP
  selector: {observability.raytrain.io/component: otel-gateway}
  ports:
    - {name: grpc, port: 4317, targetPort: grpc}
    - {name: http, port: 4318, targetPort: http}
    - {name: metrics, port: 8888, targetPort: metrics}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: otel-gateway
  namespace: opentelemetry
spec:
  serviceName: otel-gateway-headless
  replicas: 2
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels: {observability.raytrain.io/component: otel-gateway}
  template:
    metadata:
      labels: {observability.raytrain.io/component: otel-gateway}
    spec:
      priorityClassName: raytrain-observability-additive
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {observability.raytrain.io/component: otel-gateway}
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [172.28.1.222]
      containers:
        - name: collector
          image: harbor.wellspiking.ai/hub/otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
          imagePullPolicy: IfNotPresent
          args: [--config=/etc/otelcol/config/collector.yaml]
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: {name: otel-clickhouse-auth, key: password}
            - {name: GOMEMLIMIT, value: 768MiB}
          startupProbe:
            httpGet: {path: /readyz, port: 18080}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: 18080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /livez, port: 18080}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol/config, readOnly: true}
            - {name: queue, mountPath: /var/lib/otelcol}
            - {name: mtls, mountPath: /etc/obs-mtls, readOnly: true}
        - name: envoy
          image: harbor.wellspiking.ai/hub/envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              umask 077
              sed "s/__POD_IP__/${POD_IP:?}/g" /etc/envoy-template/proxy-otel.yaml > /var/run/envoy/envoy.yaml
              exec envoy -c /var/run/envoy/envoy.yaml --concurrency 1 --disable-hot-restart
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          ports:
            - {name: grpc, containerPort: 4317}
            - {name: http, containerPort: 4318}
            - {name: metrics, containerPort: 8888}
            - {name: health, containerPort: 18080}
          startupProbe:
            tcpSocket: {port: health}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: health}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: envoy-config, mountPath: /etc/envoy-template, readOnly: true}
            - {name: envoy-run, mountPath: /var/run/envoy}
            - {name: mtls, mountPath: /etc/obs-mtls, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-gateway-config}
        - name: envoy-config
          configMap: {name: otel-gateway-proxy}
        - name: envoy-run
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: mtls
          secret:
            secretName: obs-mtls-otel-gateway
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: queue
      spec:
        storageClassName: ebs-ssd-observability-retain
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 20Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: otel-gateway
  namespace: opentelemetry
spec:
  minAvailable: 1
  selector:
    matchLabels: {observability.raytrain.io/component: otel-gateway}
