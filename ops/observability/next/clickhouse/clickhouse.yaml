apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: observability
  namespace: observability-analytics
spec:
  defaults:
    storageManagement:
      provisioner: Operator
      reclaimPolicy: Retain
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: clickhouse-data
      serviceTemplate: internal
  configuration:
    zookeeper:
      # Each fixed loopback listener authenticates outbound traffic as clickhouse.
      nodes:
        - {host: 127.0.0.1, port: 12181}
        - {host: 127.0.0.1, port: 12182}
        - {host: 127.0.0.1, port: 12183}
      session_timeout_ms: 30000
      operation_timeout_ms: 10000
    clusters:
      - name: telemetry
        # Advertise secure native inter-replica traffic through Envoy :9440.
        secure: "yes"
        insecure: "yes"
        secret:
          auto: "true"
        layout:
          shardsCount: 1
          replicasCount: 2
    users:
      default/password_sha256_hex:
        valueFrom:
          secretKeyRef: {name: clickhouse-auth, key: default-password-sha256}
      schema_admin/password_sha256_hex:
        valueFrom:
          secretKeyRef: {name: clickhouse-auth, key: admin-password-sha256}
      schema_admin/networks/ip: ["0.0.0.0/0"]
      schema_admin/grants/query:
        - "GRANT ALL ON *.* WITH GRANT OPTION"
      otel_ingest/password_sha256_hex:
        valueFrom:
          secretKeyRef: {name: clickhouse-auth, key: ingest-password-sha256}
      otel_ingest/networks/ip: ["0.0.0.0/0"]
      otel_ingest/profile: ingest
      otel_ingest/grants/query:
        - "GRANT INSERT, SHOW COLUMNS ON observability_canary.otel_logs"
        - "GRANT INSERT, SHOW COLUMNS ON observability_canary.otel_traces"
      observability_query/password_sha256_hex:
        valueFrom:
          secretKeyRef: {name: clickhouse-auth, key: query-password-sha256}
      observability_query/networks/ip: ["0.0.0.0/0"]
      observability_query/profile: readonly
      observability_query/grants/query:
        - "GRANT SELECT ON observability_canary.*"
    profiles:
      default/max_threads: 2
      default/max_memory_usage: 2147483648
      ingest/max_threads: 2
      ingest/max_memory_usage: 1073741824
      ingest/async_insert: 1
      ingest/wait_for_async_insert: 1
      ingest/async_insert_busy_timeout_ms: 1000
      readonly/readonly: 1
      readonly/max_threads: 2
      readonly/max_memory_usage: 1073741824
      readonly/max_execution_time: 30
    settings:
      max_server_memory_usage: 6442450944
      max_concurrent_queries: 20
      max_thread_pool_size: 128
      max_thread_pool_free_size: 32
      thread_pool_queue_size: 128
      # Explicit small background pools: the 26.8 defaults otherwise consume
      # all 128 global workers before the first query can execute.
      background_buffer_flush_schedule_pool_size: 2
      background_message_broker_schedule_pool_size: 2
      background_distributed_schedule_pool_size: 2
      background_streaming_schedule_pool_size: 2
      background_common_pool_size: 2
      async_insert_threads: 2
      tables_loader_foreground_pool_size: 1
      tables_loader_background_pool_size: 1
      background_pool_size: 4
      background_merges_mutations_concurrency_ratio: 2
      merge_tree/number_of_free_entries_in_pool_to_execute_mutation: 4
      merge_tree/number_of_free_entries_in_pool_to_lower_max_size_of_merge: 4
      merge_tree/number_of_free_entries_in_pool_to_execute_optimize_entire_partition: 4
      background_schedule_pool_size: 4
      background_fetches_pool_size: 2
      background_move_pool_size: 2
      mark_cache_size: 268435456
      uncompressed_cache_size: 67108864
      prometheus/endpoint: /metrics
      prometheus/port: 9363
      prometheus/metrics: true
      prometheus/events: true
      prometheus/asynchronous_metrics: true
    files:
      # Envoy terminates the authenticated operator connection inside this Pod.
      # Keep the operator-generated password/grants; its original Pod-IP ACL
      # would reject the authenticated connection's loopback source address.
      users.d/zz-mtls-operator.xml: |
        <clickhouse><users><clickhouse_operator>
          <networks replace="replace"><ip>127.0.0.1</ip></networks>
        </clickhouse_operator></users></clickhouse>
      config.d/zz-mtls.xml: |
        <clickhouse>
          <listen_host replace="replace">127.0.0.1</listen_host>
          <interserver_listen_host replace="replace">127.0.0.1</interserver_listen_host>
          <http_port replace="replace">8123</http_port><tcp_port replace="replace">9000</tcp_port>
          <!-- DDLTask uses tcp_port_secure to recognize this replica's :9440
               remote_servers address. This listener remains loopback only. -->
          <tcp_port_secure replace="replace">9440</tcp_port_secure><https_port remove="1"/>
          <interserver_http_port remove="1"/><interserver_https_port>9010</interserver_https_port>
          <interserver_http_credentials replace="replace">
            <user from_env="INTERSERVER_USER"/><password from_env="INTERSERVER_PASSWORD"/>
            <allow_empty>false</allow_empty>
          </interserver_http_credentials>
          <openSSL replace="replace">
            <server>
              <certificateFile>/etc/obs-mtls/tls.crt</certificateFile>
              <privateKeyFile>/etc/obs-mtls/tls.key</privateKeyFile>
              <caConfig>/etc/obs-mtls/ca.crt</caConfig><loadDefaultCAFile>false</loadDefaultCAFile>
              <verificationMode>strict</verificationMode><disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
            </server>
            <client>
              <certificateFile>/etc/obs-mtls/tls.crt</certificateFile>
              <privateKeyFile>/etc/obs-mtls/tls.key</privateKeyFile>
              <caConfig>/etc/obs-mtls/ca.crt</caConfig><loadDefaultCAFile>false</loadDefaultCAFile>
              <verificationMode>strict</verificationMode><extendedVerification>true</extendedVerification>
              <invalidCertificateHandler><name>RejectCertificateHandler</name></invalidCertificateHandler>
              <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1</disableProtocols>
            </client>
          </openSSL>
        </clickhouse>
  templates:
    serviceTemplates:
      - name: internal
        generateName: clickhouse-{chi}
        spec:
          type: ClusterIP
          ports:
            - {name: https, port: 8443, targetPort: 8443}
            - {name: tcp-secure, port: 9440, targetPort: 9440}
    podTemplates:
      - name: clickhouse
        metadata:
          labels:
            observability.raytrain.io/component: clickhouse
        spec:
          priorityClassName: raytrain-observability-additive
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 90
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: {type: RuntimeDefault}
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels: {observability.raytrain.io/component: clickhouse}
                  topologyKey: kubernetes.io/hostname
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: [172.28.1.222]
          containers:
            - name: clickhouse
              image: harbor.wellspiking.ai/hub/clickhouse/clickhouse-server:26.8.20.9@sha256:9b61e3c635c04ad5bb521eb4f6e61ce7585b5580814e51c25bb9e8292ce43364
              imagePullPolicy: IfNotPresent
              env:
                - name: INTERSERVER_USER
                  valueFrom:
                    secretKeyRef: {name: obs-clickhouse-interserver-auth, key: username}
                - name: INTERSERVER_PASSWORD
                  valueFrom:
                    secretKeyRef: {name: obs-clickhouse-interserver-auth, key: password}
              startupProbe:
                exec: {command: [/bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8123; printf 'GET /ping HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q '200' "]}
                periodSeconds: 5
                failureThreshold: 60
              readinessProbe:
                exec: {command: [/bin/bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8123; printf 'GET /ping HTTP/1.0\r\n\r\n' >&3; head -1 <&3 | grep -q '200' "]}
                periodSeconds: 10
              livenessProbe:
                exec: {command: [/bin/bash, -ec, "pgrep -f '^/usr/bin/clickhouse-server|^clickhouse-server' >/dev/null"]}
                periodSeconds: 20
                failureThreshold: 3
              resources:
                requests: {cpu: "1", memory: 4Gi}
                limits: {cpu: "2", memory: 8Gi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              ports:
                - {name: prometheus, containerPort: 9363}
                - {name: tcp-secure, containerPort: 9440}
              volumeMounts:
                - {name: mesh-tls, mountPath: /etc/obs-mtls, readOnly: true}
            - name: envoy
              image: harbor.wellspiking.ai/hub/envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
              command: [/bin/sh, -ec]
              args: ['sed "s/__POD_IP__/$POD_IP/g" /etc/envoy-source/proxy-clickhouse.yaml > /var/run/envoy/config.yaml; exec envoy -c /var/run/envoy/config.yaml --concurrency 1 --disable-hot-restart']
              env:
                - name: POD_IP
                  valueFrom: {fieldRef: {fieldPath: status.podIP}}
              resources:
                requests: {cpu: 100m, memory: 128Mi}
                limits: {cpu: 250m, memory: 256Mi}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              readinessProbe: {httpGet: {path: /readyz, port: 18080}, periodSeconds: 5}
              volumeMounts:
                - {name: proxy-config, mountPath: /etc/envoy-source, readOnly: true}
                - {name: proxy-runtime, mountPath: /var/run/envoy}
                - {name: mesh-tls, mountPath: /etc/obs-mtls, readOnly: true}
          volumes:
            - name: mesh-tls
              secret:
                secretName: obs-mtls-clickhouse
                defaultMode: 0440
            - name: proxy-config
              configMap: {name: observability-proxy-clickhouse}
            - name: proxy-runtime
              emptyDir: {sizeLimit: 16Mi}
    volumeClaimTemplates:
      - name: clickhouse-data
        provisioner: Operator
        reclaimPolicy: Retain
        spec:
          storageClassName: ebs-ssd-observability-retain
          accessModes: [ReadWriteOnce]
          resources:
            requests: {storage: 100Gi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: observability-clickhouse
  namespace: observability-analytics
spec:
  minAvailable: 1
  selector:
    matchLabels: {observability.raytrain.io/component: clickhouse}
