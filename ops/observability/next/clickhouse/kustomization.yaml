apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clickhouse
resources:
  - keeper.yaml
  - clickhouse.yaml
  - network-policy.yaml
  - operator-egress-services.yaml
# Run bootstrap-job.yaml only after Keeper and both CH replicas are Ready.
configMapGenerator:
  - name: clickhouse-schema
    files: [schema.sql]
  - name: clickhouse-proxy-clickhouse
    files: [proxy-clickhouse.yaml]
  - name: clickhouse-proxy-keeper
    files: [proxy-keeper.yaml]
  - name: clickhouse-proxy-operator
    files: [proxy-operator.yaml]
  - name: clickhouse-schema-client
    files: [schema-client.xml]
generatorOptions:
  disableNameSuffixHash: true
