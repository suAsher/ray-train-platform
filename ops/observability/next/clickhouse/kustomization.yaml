apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability-analytics
resources:
  - keeper.yaml
  - clickhouse.yaml
  - network-policy.yaml
# Run bootstrap-job.yaml only after Keeper and both CH replicas are Ready.
configMapGenerator:
  - name: observability-clickhouse-schema
    files: [schema.sql]
generatorOptions:
  disableNameSuffixHash: true
