# Optional defense in depth only. The existing CNI remains unchanged and does
# not enforce these policies; loopback + exact-role mTLS is the security boundary.
# These policies select only new namespace/pods. No existing traffic is changed.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-ingress
  namespace: clickhouse
spec:
  podSelector:
    matchLabels: {observability.raytrain.io/component: clickhouse}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse}
      ports:
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9009}
    - from:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse-operator}
      ports:
        - {protocol: TCP, port: 8123}
    - from:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse-bootstrap}
      ports:
        - {protocol: TCP, port: 9000}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: opentelemetry}
          podSelector:
            matchLabels: {observability.raytrain.io/component: otel-gateway}
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse-canary-query}
      ports:
        - {protocol: TCP, port: 9440}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: victoriametrics}
      ports:
        - {protocol: TCP, port: 9363}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse}
      ports:
        - {protocol: TCP, port: 9000}
        - {protocol: TCP, port: 9009}
    - to:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: keeper}
      ports:
        - {protocol: TCP, port: 2181}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keeper-ingress
  namespace: clickhouse
spec:
  podSelector:
    matchLabels: {observability.raytrain.io/component: keeper}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: keeper}
      ports:
        - {protocol: TCP, port: 9234}
        - {protocol: TCP, port: 2181}
    - from:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse}
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse-operator}
      ports:
        - {protocol: TCP, port: 2181}
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: victoriametrics}
      ports:
        - {protocol: TCP, port: 7000}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: keeper}
      ports:
        - {protocol: TCP, port: 9234}
        - {protocol: TCP, port: 2181}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-operator
  namespace: clickhouse
spec:
  podSelector:
    matchLabels: {observability.raytrain.io/component: clickhouse-operator}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: victoriametrics}
      ports:
        - {protocol: TCP, port: 9999}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock: {cidr: 10.0.96.1/32}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - ipBlock: {cidr: 172.28.2.64/32}
        - ipBlock: {cidr: 172.28.5.50/32}
      ports:
        - {protocol: TCP, port: 6443}
    - to:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: clickhouse}
      ports:
        - {protocol: TCP, port: 8123}
    - to:
        - podSelector:
            matchLabels: {observability.raytrain.io/component: keeper}
      ports:
        - {protocol: TCP, port: 2181}
