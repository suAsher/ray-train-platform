{
  "static_resources": {
    "listeners": [
      {
        "name": "keeper-client",
        "address": {
          "socket_address": {
            "address": "__POD_IP__",
            "port_value": 2281
          }
        },
        "filter_chains": [
          {
            "transport_socket": {
              "name": "envoy.transport_sockets.tls",
              "typed_config": {
                "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext",
                "require_client_certificate": true,
                "common_tls_context": {
                  "tls_params": {
                    "tls_minimum_protocol_version": "TLSv1_2"
                  },
                  "tls_certificates": [
                    {
                      "certificate_chain": {
                        "filename": "/etc/obs-mtls/tls.crt"
                      },
                      "private_key": {
                        "filename": "/etc/obs-mtls/tls.key"
                      }
                    }
                  ],
                  "validation_context": {
                    "trusted_ca": {
                      "filename": "/etc/obs-mtls/ca.crt"
                    },
                    "match_typed_subject_alt_names": [
                      {
                        "san_type": "URI",
                        "matcher": {
                          "exact": "spiffe://observability.raytrain.local/observability-analytics/clickhouse"
                        }
                      },
                      {
                        "san_type": "URI",
                        "matcher": {
                          "exact": "spiffe://observability.raytrain.local/observability-analytics/ch-operator"
                        }
                      }
                    ]
                  }
                }
              }
            },
            "filters": [
              {
                "name": "envoy.filters.network.tcp_proxy",
                "typed_config": {
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy",
                  "stat_prefix": "keeper-client",
                  "cluster": "native-client",
                  "idle_timeout": "0s"
                }
              }
            ]
          }
        ]
      },
      {
        "name": "keeper-raft",
        "address": {
          "socket_address": {
            "address": "__POD_IP__",
            "port_value": 9234
          }
        },
        "filter_chains": [
          {
            "transport_socket": {
              "name": "envoy.transport_sockets.tls",
              "typed_config": {
                "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext",
                "require_client_certificate": true,
                "common_tls_context": {
                  "tls_params": {
                    "tls_minimum_protocol_version": "TLSv1_2"
                  },
                  "tls_certificates": [
                    {
                      "certificate_chain": {
                        "filename": "/etc/obs-mtls/tls.crt"
                      },
                      "private_key": {
                        "filename": "/etc/obs-mtls/tls.key"
                      }
                    }
                  ],
                  "validation_context": {
                    "trusted_ca": {
                      "filename": "/etc/obs-mtls/ca.crt"
                    },
                    "match_typed_subject_alt_names": [
                      {
                        "san_type": "URI",
                        "matcher": {
                          "exact": "spiffe://observability.raytrain.local/observability-analytics/keeper"
                        }
                      }
                    ]
                  }
                }
              }
            },
            "filters": [
              {
                "name": "envoy.filters.network.tcp_proxy",
                "typed_config": {
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy",
                  "stat_prefix": "keeper-raft",
                  "cluster": "native-raft",
                  "idle_timeout": "0s"
                }
              }
            ]
          }
        ]
      },
      {
        "name": "metrics",
        "address": {
          "socket_address": {
            "address": "__POD_IP__",
            "port_value": 7000
          }
        },
        "filter_chains": [
          {
            "transport_socket": {
              "name": "envoy.transport_sockets.tls",
              "typed_config": {
                "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext",
                "require_client_certificate": true,
                "common_tls_context": {
                  "tls_params": {
                    "tls_minimum_protocol_version": "TLSv1_2"
                  },
                  "tls_certificates": [
                    {
                      "certificate_chain": {
                        "filename": "/etc/obs-mtls/tls.crt"
                      },
                      "private_key": {
                        "filename": "/etc/obs-mtls/tls.key"
                      }
                    }
                  ],
                  "validation_context": {
                    "trusted_ca": {
                      "filename": "/etc/obs-mtls/ca.crt"
                    },
                    "match_typed_subject_alt_names": [
                      {
                        "san_type": "URI",
                        "matcher": {
                          "exact": "spiffe://observability.raytrain.local/observability-metrics/vmagent"
                        }
                      }
                    ]
                  }
                }
              }
            },
            "filters": [
              {
                "name": "envoy.filters.network.http_connection_manager",
                "typed_config": {
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager",
                  "stat_prefix": "metrics",
                  "codec_type": "AUTO",
                  "route_config": {
                    "name": "metrics",
                    "virtual_hosts": [
                      {
                        "name": "metrics",
                        "domains": [
                          "*"
                        ],
                        "routes": [
                          {
                            "match": {
                              "path": "/metrics",
                              "headers": [
                                {
                                  "name": ":method",
                                  "string_match": {
                                    "exact": "GET"
                                  }
                                }
                              ]
                            },
                            "route": {
                              "cluster": "native-metrics",
                              "timeout": "10s"
                            }
                          },
                          {
                            "match": {
                              "prefix": "/"
                            },
                            "direct_response": {
                              "status": 404
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "http_filters": [
                    {
                      "name": "envoy.filters.http.router",
                      "typed_config": {
                        "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      },
      {
        "name": "health",
        "address": {
          "socket_address": {
            "address": "__POD_IP__",
            "port_value": 18080
          }
        },
        "filter_chains": [
          {
            "filters": [
              {
                "name": "envoy.filters.network.http_connection_manager",
                "typed_config": {
                  "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager",
                  "stat_prefix": "health",
                  "codec_type": "AUTO",
                  "route_config": {
                    "name": "health",
                    "virtual_hosts": [
                      {
                        "name": "health",
                        "domains": [
                          "*"
                        ],
                        "routes": [
                          {
                            "match": {
                              "safe_regex": {
                                "regex": "^/(readyz|livez)$"
                              },
                              "headers": [
                                {
                                  "name": ":method",
                                  "string_match": {
                                    "exact": "GET"
                                  }
                                }
                              ]
                            },
                            "direct_response": {
                              "status": 200
                            }
                          },
                          {
                            "match": {
                              "prefix": "/"
                            },
                            "direct_response": {
                              "status": 404
                            }
                          }
                        ]
                      }
                    ]
                  },
                  "http_filters": [
                    {
                      "name": "envoy.filters.http.health_check",
                      "typed_config": {
                        "@type": "type.googleapis.com/envoy.extensions.filters.http.health_check.v3.HealthCheck",
                        "pass_through_mode": false,
                        "headers": [
                          {
                            "name": ":path",
                            "string_match": {
                              "safe_regex": {
                                "regex": "^/(readyz|livez)$"
                              }
                            }
                          },
                          {
                            "name": ":method",
                            "string_match": {
                              "exact": "GET"
                            }
                          }
                        ],
                        "cluster_min_healthy_percentages": {
                          "native-health": {
                            "value": 100
                          }
                        }
                      }
                    },
                    {
                      "name": "envoy.filters.http.router",
                      "typed_config": {
                        "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
                      }
                    }
                  ]
                }
              }
            ]
          }
        ]
      }
    ],
