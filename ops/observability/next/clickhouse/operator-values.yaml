# Altinity chart altinity-clickhouse-operator 0.27.4 only.
# Render and inspect on the existing builder before installation.
fullnameOverride: clickhouse-operator
namespaceOverride: clickhouse
watchNamespaces:
  # A literal is required for namespace-scoped informers. Even an anchored
  # regexp makes Altinity 0.27.4 LIST cluster-wide, then filter in-process.
  - clickhouse
rbac:
  create: true
  namespaceScoped: true
crdHook:
  enabled: false
secret:
  create: false
operator:
  image:
    repository: harbor.wellspiking.ai/hub/altinity/clickhouse-operator
    tag: "0.27.4@sha256:c60c872fedd85017f843167dfdd2b900bb06b668a3deaf02b21782e59af859e3"
  priorityClassName: raytrain-observability-additive
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
metrics:
  enabled: false
podLabels:
  observability.raytrain.io/component: clickhouse-operator
podAnnotations:
  # Empty maps do not erase Helm's default annotations. Only the new mTLS
  # vmagent target should collect this operator's authenticated metrics port.
  prometheus.io/scrape: "false"
  clickhouse-operator-metrics/scrape: "false"
serviceMonitor:
  enabled: false
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile: {type: RuntimeDefault}
nodeSelector: {}
tolerations: []
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [172.28.1.222, 172.28.3.32]
configs:
  files:
    config.yaml:
      clickhouse:
        access:
          # Operator HTTP client has no mTLS certificate hook. Only its Pod's
          # fixed hostAliases + Envoy egress may use this loopback HTTP port.
          scheme: http
          port: 8123
          secret:
            namespace: clickhouse
            name: clickhouse-operator-auth
        security:
          ipc:
            mode: Secure
            bindHost: 127.0.0.1
  # Do not install the default 30-day system log overrides.
  configdFiles:
    01-clickhouse-01-listen.xml: |
      <clickhouse><listen_host replace="replace">127.0.0.1</listen_host><listen_try>0</listen_try></clickhouse>
    01-clickhouse-02-logger.xml: |
      <clickhouse><logger><level>warning</level><console>1</console><log remove="1"/><errorlog remove="1"/></logger></clickhouse>
    01-clickhouse-03-query_log.xml: |
      <clickhouse><query_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></query_log><query_thread_log remove="1"/></clickhouse>
    01-clickhouse-04-part_log.xml: |
      <clickhouse><part_log><ttl>event_date + INTERVAL 3 DAY DELETE</ttl></part_log></clickhouse>
    01-clickhouse-05-trace_log.xml: |
      <clickhouse><trace_log remove="1"/></clickhouse>
