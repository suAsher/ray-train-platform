{{- if ne .Release.Namespace .Values.expectedNamespace }}{{ fail "platform telemetry must be installed in victoriametrics" }}{{ end -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: obs-mtls-backend-telemetry
  namespace: ray-train-platform
spec:
  secretName: obs-mtls-backend-telemetry
  duration: 2160h
  renewBefore: 720h
  issuerRef: {name: obs-mtls-mesh, kind: ClusterIssuer, group: cert-manager.io}
  usages: [server auth, client auth]
  dnsNames:
    - backend-metrics.ray-train-platform.svc
    - backend-metrics.ray-train-platform.svc.cluster.local
  uris: [spiffe://observability.raytrain.local/ray-train-platform/backend-telemetry]
  privateKey: {algorithm: RSA, size: 2048, rotationPolicy: Always}
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: obs-backend-telemetry
spec:
  allowed:
    dnsNames:
      required: true
      values: [backend-metrics.ray-train-platform.svc, backend-metrics.ray-train-platform.svc.cluster.local]
    uris:
      required: true
      values: [spiffe://observability.raytrain.local/ray-train-platform/backend-telemetry]
    usages: [server auth, client auth]
    isCA: false
  constraints:
    minDuration: 2160h
    maxDuration: 2160h
    privateKey: {algorithm: RSA, minSize: 2048}
  selector:
    issuerRef: {name: obs-mtls-mesh, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [ray-train-platform]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obs-backend-telemetry-policy-use
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    resourceNames: [obs-backend-telemetry]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obs-backend-telemetry-policy-use
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obs-backend-telemetry-policy-use
subjects:
  - {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
