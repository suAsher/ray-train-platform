apiVersion: v1
kind: Service
metadata:
  name: backend-metrics
  namespace: ray-train-platform
  labels: {observability.raytrain.io/component: backend-metrics}
spec:
  type: ClusterIP
  selector: {app: ray-train-backend}
  ports:
    - {name: metrics, port: 9091, targetPort: metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: platform-telemetry-discovery
  namespace: ray-train-platform
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: platform-telemetry-discovery
  namespace: ray-train-platform
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: platform-telemetry-discovery}
subjects:
  - {kind: ServiceAccount, name: vm-self-scraper, namespace: victoriametrics}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: platform-backend
  namespace: victoriametrics
  labels:
    observability.raytrain.io/scrape: business-wave1
    observability.raytrain.io/target: platform-backend
spec:
  namespaceSelector: {matchNames: [ray-train-platform]}
  selector:
    matchLabels: {observability.raytrain.io/component: backend-metrics}
  endpoints:
    - port: metrics
      path: /metrics
      scheme: https
      interval: {{ .Values.scrapeInterval }}
      scrapeTimeout: {{ .Values.scrapeTimeout }}
      honorLabels: false
      tlsConfig:
        ca: {secret: {name: obs-mtls-vmagent, key: ca.crt}}
        cert: {secret: {name: obs-mtls-vmagent, key: tls.crt}}
        keySecret: {name: obs-mtls-vmagent, key: tls.key}
        serverName: backend-metrics.ray-train-platform.svc
        insecureSkipVerify: false
      relabelConfigs:
        - {source_labels: [__meta_kubernetes_service_name], regex: backend-metrics, action: keep}
        - {target_label: cluster, replacement: raytrain-vke}
        - {target_label: component, replacement: platform-backend}
        - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
        - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
        - {source_labels: [__meta_kubernetes_pod_node_name], target_label: node}
      metricRelabelConfigs:
        - source_labels: [__name__]
          regex: 'raytrain_(http_.*|telemetry_.*)|go_.*|process_.*'
          action: keep
        - action: labelkeep
          regex: '__name__|job|instance|cluster|component|namespace|pod|node|container|service|endpoint|route|method|status_class|result|signal|reason|le|quantile|version'
