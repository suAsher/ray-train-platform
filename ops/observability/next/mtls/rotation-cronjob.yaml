  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [vmalertmanager-victoriametrics-cluster]
    verbs: [get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    resourceNames: [vmalertmanager-victoriametrics-cluster]
    verbs: [get]
  - apiGroups: ['']
