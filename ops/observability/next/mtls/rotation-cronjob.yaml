    resourceNames: [nightingale-redis-server]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [nightingale]
    verbs: [get]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    resourceNames: [nightingale-redis-pdb, nightingale]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: ['']
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: native-certificate-rotation
  namespace: nightingale
subjects:
  - {kind: ServiceAccount, name: native-certificate-rotation, namespace: cert-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: native-certificate-rotation}
---
apiVersion: rbac.authorization.k8s.io/v1
