---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: native-certificate-rotation
  namespace: victoriametrics
subjects:
  - {kind: ServiceAccount, name: native-certificate-rotation, namespace: cert-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: native-certificate-rotation}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: native-certificate-rotation
  namespace: cert-manager
spec:
  schedule: '*/15 * * * *'
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 6600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: native-certificate-rotation}
        spec:
          serviceAccountName: native-certificate-rotation
          automountServiceAccountToken: true
          priorityClassName: raytrain-observability-additive
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: {type: RuntimeDefault}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: NotIn
                        values: [172.28.1.222, 172.28.3.32]
          containers:
            - name: rotate
              # Reuse the verified Python runtime; command runs only this script, not the N9E application.
              image: harbor.wellspiking.ai/guofeng.su/nightingale-observability:9.1.1-sentinel-01abc76@sha256:2e544213530f914b961e05d9fbab2ddcbbb995402379496a34815f0d61da6315
              command: [python3, -B, /config/rotation.py]
              env:
                - name: POD_UID
                  valueFrom: {fieldRef: {fieldPath: metadata.uid}}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
          volumes:
            - name: config
              configMap: {name: native-certificate-rotation, defaultMode: 0444}
