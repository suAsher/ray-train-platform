apiVersion: v1
kind: ServiceAccount
metadata:
  name: native-certificate-rotation
  namespace: cert-manager
automountServiceAccountToken: true
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: native-certificate-rotation
  namespace: cert-manager
spec:
  leaseDurationSeconds: 120
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: native-certificate-rotation
  namespace: cert-manager
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [native-certificate-rotation]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: native-certificate-rotation
  namespace: cert-manager
subjects:
  - {kind: ServiceAccount, name: native-certificate-rotation, namespace: cert-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: native-certificate-rotation}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: native-certificate-rotation
  namespace: clickhouse
rules:
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [obs-mtls-keeper, obs-mtls-clickhouse]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [chk-clickhouse-keeper-0-0, chk-clickhouse-keeper-0-1, chk-clickhouse-keeper-0-2, chi-clickhouse-telemetry-0-0, chi-clickhouse-telemetry-0-1]
    verbs: [get]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    resourceNames: [chk-clickhouse-keeper, chi-clickhouse-telemetry]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, patch]
  - apiGroups: ['']
    resources: [pods/eviction]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: native-certificate-rotation
  namespace: clickhouse
subjects:
  - {kind: ServiceAccount, name: native-certificate-rotation, namespace: cert-manager}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: native-certificate-rotation}
---
