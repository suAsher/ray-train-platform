apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-ui
  namespace: nightingale
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-ui
  namespace: nightingale
  labels:
    {{- include "ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "ui.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ui.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: observability-ui
      automountServiceAccountToken: false
      priorityClassName: raytrain-observability-additive
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [172.28.1.222, 172.28.3.32]
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    {{- include "ui.selector" . | nindent 20 }}
      containers:
        - name: envoy
          image: {{ .Values.image | quote }}
          command: [/usr/local/bin/envoy]
          args: [-c, /etc/ui-config/envoy.yaml, --concurrency, "1", --disable-hot-restart, --log-level, warning]
          ports:
            - {name: n9e-https, containerPort: 8443}
            - {name: grafana-https, containerPort: 8444}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            tcpSocket: {port: n9e-https}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: n9e-https}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: n9e-https}
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: config, mountPath: /etc/ui-config, readOnly: true}
            - {name: browser-server, mountPath: /etc/ui-server, readOnly: true}
            - {name: n9e-client, mountPath: /etc/ui-client, readOnly: true}
      volumes:
        - name: config
          configMap: {name: observability-ui}
        - name: browser-server
          secret: {secretName: obs-ui-browser-server, defaultMode: 0440}
        - name: n9e-client
          secret: {secretName: obs-mtls-n9e-ui-gateway, defaultMode: 0440}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: observability-ui
  namespace: nightingale
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "ui.selector" . | nindent 6 }}
