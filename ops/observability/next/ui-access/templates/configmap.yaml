apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-ui
  namespace: nightingale
  labels:
    {{- include "ui.labels" . | nindent 4 }}
data:
  envoy.yaml: |
    node: {id: observability-ui, cluster: observability-ui}
    static_resources:
      listeners:
      {{- range $ui := list (dict "name" "nightingale" "port" 8443) (dict "name" "grafana" "port" 8444) }}
        - name: {{ $ui.name }}
          address:
            socket_address: {address: 0.0.0.0, port_value: {{ $ui.port }}}
          filter_chains:
            - transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  common_tls_context:
                    tls_params: {tls_minimum_protocol_version: TLSv1_2}
                    alpn_protocols: [h2, http/1.1]
                    tls_certificate_sds_secret_configs:
                      - name: browser-server
                        sds_config:
                          resource_api_version: V3
                          path_config_source:
                            path: /etc/ui-config/browser-sds.yaml
                            watched_directory: {path: /etc/ui-config}
              filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: {{ $ui.name }}_ui
                    codec_type: AUTO
                    use_remote_address: true
                    xff_num_trusted_hops: 0
                    normalize_path: true
                    merge_slashes: true
                    path_with_escaped_slashes_action: REJECT_REQUEST
                    request_headers_timeout: 10s
                    stream_idle_timeout: 300s
                    upgrade_configs: [{upgrade_type: websocket}]
                    route_config:
                      name: {{ $ui.name }}_ui
                      request_headers_to_remove:
                        - forwarded
                        - x-forwarded-for
                        - x-forwarded-host
                        - x-forwarded-port
                        - x-forwarded-client-cert
                        - x-real-ip
                        - x-forwarded-user
                        - x-forwarded-email
                        - x-forwarded-groups
                        - x-forwarded-role
                        - x-forwarded-preferred-username
                        - x-forwarded-access-token
                        - x-auth-request-user
                        - x-auth-request-email
                        - x-auth-request-groups
                        - x-auth-request-preferred-username
                        - x-auth-request-access-token
                        - x-webauth-user
                        - x-webauth-email
                        - x-webauth-name
                        - x-webauth-role
                        - remote-user
                        - remote-email
                      request_headers_to_add:
                        - header: {key: x-forwarded-proto, value: https}
                          append_action: OVERWRITE_IF_EXISTS_OR_ADD
                      virtual_hosts:
                        - name: {{ $ui.name }}
                          domains: ["*"]
                          routes:
                            - match: {path_separated_prefix: /metrics}
                              direct_response: {status: 404}
                            - match: {prefix: /}
                              route: {cluster: {{ $ui.name }}, timeout: 0s}
                    http_filters:
                      - name: envoy.filters.http.lua
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                          default_source_code: {filename: /etc/ui-config/secure-cookies.lua}
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      {{- end }}
      clusters:
        - name: nightingale
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: nightingale
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: nightingale.nightingale.svc, port_value: 17443}
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: nightingale.nightingale.svc
              common_tls_context:
                tls_params: {tls_minimum_protocol_version: TLSv1_3, tls_maximum_protocol_version: TLSv1_3}
                tls_certificate_sds_secret_configs:
                  - name: n9e-client
                    sds_config:
                      resource_api_version: V3
                      path_config_source:
                        path: /etc/ui-config/client-sds.yaml
                        watched_directory: {path: /etc/ui-config}
                validation_context_sds_secret_config:
                  name: n9e-validation
                  sds_config:
                    resource_api_version: V3
                    path_config_source:
                      path: /etc/ui-config/validation-sds.yaml
                      watched_directory: {path: /etc/ui-config}
        - name: grafana
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: grafana
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: {address: grafana-ui-backend.monitoring.svc, port_value: 80}
  secure-cookies.lua: |
    function envoy_on_response(handle)
      local headers = handle:headers()
      local count = headers:getNumValues("set-cookie")
      if count == 0 then return end
      local cookies = {}
      for index = 0, count - 1 do
        local cookie = headers:getAtIndex("set-cookie", index)
        if not string.lower(cookie .. ";"):find(";%s*secure%s*;") then
          cookie = cookie .. "; Secure"
        end
        cookies[#cookies + 1] = cookie
      end
      headers:remove("set-cookie")
      for _, cookie in ipairs(cookies) do
        headers:add("set-cookie", cookie)
      end
    end
  browser-sds.yaml: |
    version_info: "1"
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: browser-server
        tls_certificate:
          certificate_chain: {filename: /etc/ui-server/tls.crt}
          private_key: {filename: /etc/ui-server/tls.key}
          watched_directory: {path: /etc/ui-server}
  client-sds.yaml: |
    version_info: "1"
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: n9e-client
        tls_certificate:
          certificate_chain: {filename: /etc/ui-client/tls.crt}
          private_key: {filename: /etc/ui-client/tls.key}
          watched_directory: {path: /etc/ui-client}
  validation-sds.yaml: |
    version_info: "1"
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: n9e-validation
        validation_context:
          trusted_ca: {filename: /etc/ui-client/ca.crt}
          watched_directory: {path: /etc/ui-client}
          match_typed_subject_alt_names:
            - san_type: URI
              matcher: {exact: spiffe://observability.raytrain.local/nightingale/nightingale}
