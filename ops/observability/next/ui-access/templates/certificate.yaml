{{- include "ui.validate" . -}}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: obs-ui-browser-server
  namespace: nightingale
  labels:
    {{- include "ui.labels" . | nindent 4 }}
spec:
  secretName: obs-ui-browser-server
  duration: 2160h
  renewBefore: 720h
  issuerRef: {name: obs-mtls-mesh, kind: ClusterIssuer, group: cert-manager.io}
  usages: [server auth]
  uris: [spiffe://observability.raytrain.local/nightingale/ui-browser-server]
  ipAddresses:
    {{- toYaml .Values.certificate.ipAddresses | nindent 4 }}
  privateKey: {algorithm: RSA, size: 2048, rotationPolicy: Always}
---
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: obs-ui-browser-server
spec:
  allowed:
    ipAddresses:
      required: true
      values:
        {{- toYaml .Values.certificate.ipAddresses | nindent 8 }}
    uris:
      required: true
      values: [spiffe://observability.raytrain.local/nightingale/ui-browser-server]
    usages: [server auth]
    isCA: false
  constraints:
    minDuration: 2160h
    maxDuration: 2160h
    privateKey: {algorithm: RSA, minSize: 2048}
  selector:
    issuerRef: {name: obs-mtls-mesh, kind: ClusterIssuer, group: cert-manager.io}
    namespace: {matchNames: [nightingale]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: obs-ui-browser-server-policy-use
rules:
  - apiGroups: [policy.cert-manager.io]
    resources: [certificaterequestpolicies]
    resourceNames: [obs-ui-browser-server]
    verbs: [use]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: obs-ui-browser-server-policy-use
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: obs-ui-browser-server-policy-use
subjects:
  - {kind: ServiceAccount, name: cert-manager, namespace: cert-manager}
