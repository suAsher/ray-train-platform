{{- range $ui := list (dict "name" "nightingale-ui" "target" 8443 "nodePort" .Values.service.nightingaleNodePort) (dict "name" "grafana-ui" "target" 8444 "nodePort" .Values.service.grafanaNodePort) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $ui.name }}
  namespace: nightingale
  labels:
    {{- include "ui.labels" $ | nindent 4 }}
spec:
  type: {{ $.Values.service.type }}
  {{- if eq $.Values.service.type "NodePort" }}
  externalTrafficPolicy: Cluster
  {{- end }}
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: {timeoutSeconds: 10800}
  selector:
    {{- include "ui.selector" $ | nindent 4 }}
  ports:
    - name: https
      port: 443
      targetPort: {{ $ui.target }}
      {{- if eq $.Values.service.type "NodePort" }}
      nodePort: {{ $ui.nodePort }}
      {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: grafana-ui-backend
  namespace: monitoring
  labels:
    {{- include "ui.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP: {timeoutSeconds: 10800}
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: prometheus
  ports: [{name: http, port: 80, targetPort: grafana}]
