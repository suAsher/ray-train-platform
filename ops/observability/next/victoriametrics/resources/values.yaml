name: victoriametrics-cluster
expectedNamespace: victoriametrics
storageClassName: ebs-ssd-observability-retain
priorityClassName: raytrain-observability-additive
clusterLabel: raytrain-vke
tenantID: "1001"
scrapeInterval: 30s
# First stage has only 30-second self targets. Reassess before other targets join.
dedupInterval: 30s
retentionPeriod: 30d
imagePullSecrets: []
images:
  storage: {repository: victoriametrics/vmstorage, tag: v1.153.0-cluster}
  select: {repository: victoriametrics/vmselect, tag: v1.153.0-cluster}
  insert: {repository: victoriametrics/vminsert, tag: v1.153.0-cluster}
  agent: {repository: victoriametrics/vmagent, tag: v1.153.0}
  auth: {repository: victoriametrics/vmauth, tag: v1.153.0}
  alert: {repository: victoriametrics/vmalert, tag: v1.153.0}
  alertmanager: {repository: prom/alertmanager, tag: v0.34.1}
  configReloader: victoriametrics/operator:config-reloader-v0.75.0
# Digest-pinned mirror overrides are recorded by the deployment coordinator.
secrets:
  write: vm-self-write
  read: vm-self-read
  tokenKey: token
scheduling:
  nodeSelector: {}
  tolerations: []
  excludedHostnames: [172.28.1.222, 172.28.3.32]
  # Do not pin observability to CPU nodes. GPU nodes are eligible as long as
  # they have spare CPU/memory and do not require dedicated training tolerations.
  preferredHostnames: []
storage:
  replicas: 3
  size: 50Gi
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1500m", memory: 2Gi}
select:
  replicas: 2
  resources:
    requests: {cpu: 200m, memory: 512Mi, ephemeral-storage: 100Mi}
    limits: {cpu: "1500m", memory: 1536Mi, ephemeral-storage: 3Gi}
insert:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1000m", memory: 512Mi}
agent:
  replicas: 2
  size: 20Gi
  queueLimit: 10GiB
  resources:
    requests: {cpu: 200m, memory: 256Mi}
    limits: {cpu: "1000m", memory: 768Mi}
auth:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
alert:
  replicas: 2
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
alertmanager:
  replicas: 3
  size: 20Gi
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 300m, memory: 256Mi}
configReloaderResources:
  requests: {cpu: 20m, memory: 32Mi}
  limits: {cpu: 100m, memory: 128Mi}
mtls:
  # Security is mandatory for this chart; there is no plaintext mode.
  image: harbor.wellspiking.ai/hub/envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 300m, memory: 128Mi}
  # Extra namespaces are never inferred from a Kubernetes label or an HTTP header.
  readRoleURI: spiffe://observability.raytrain.local/nightingale/nightingale
networkPolicy:
  enabled: true
  apiServerCIDRs: [10.0.96.1/32, 172.28.2.64/32, 172.28.5.50/32]
  apiServerPorts: [443, 6443]
  # Same-namespace canary Pod label: observability.raytrain.io/metrics-client=true.
  # The same label is required in this newly created alerting namespace.
  readClientNamespaces: [nightingale]
