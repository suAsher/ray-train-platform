{{/* v0.75.0 config-reloader uses Get and name-filtered List/Watch for this one
     generated Secret. TLS/source token Secrets are delivered by kubelet. */}}
{{- range $entry := list
  (dict "account" "vm-auth-reloader" "secret" (printf "vmauth-config-%s" .Values.name))
  (dict "account" "vm-am-reloader" "secret" (printf "vmalertmanager-%s-config" .Values.name))
}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $entry.account }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "metrics.labels" $ | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $entry.account }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "metrics.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $entry.secret | quote }}]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $entry.account }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "metrics.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $entry.account }}
subjects:
  - kind: ServiceAccount
    name: {{ $entry.account }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
