{{- $grafanaRead := default (dict) .Values.grafanaRead -}}
{{- if and (hasKey $grafanaRead "enabled") (not (kindIs "bool" $grafanaRead.enabled)) }}{{- fail "grafanaRead.enabled must be boolean" }}{{- end }}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  {{- include "metrics.common" (dict "root" . "component" "vmauth") | nindent 2 }}
  # Explicit SA prevents Operator's namespace-wide Secret reader generation.
  serviceAccountName: vm-auth-reloader
  {{- include "metrics.mtls.pod" (dict "root" . "role" "vmauth" "port" 8428 "reloader" true) | nindent 2 }}
  replicaCount: {{ .Values.auth.replicas }}
  image: {{ toJson .Values.images.auth }}
  imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
  resources: {{ toJson .Values.auth.resources }}
  configReloaderImage: {{ .Values.images.configReloader | quote }}
  configReloaderResources: {{ toJson .Values.configReloaderResources }}
  port: "8427"
  internalListenPort: "8428"
  selectAllByDefault: false
  userSelector:
    matchLabels:
      observability.raytrain.io/auth: self-only
  # Omitted userNamespaceSelector means this CR's namespace only.
  podDisruptionBudget:
    maxUnavailable: 1
  extraArgs:
    httpListenAddr: "127.0.0.1:8427"
    httpInternalListenAddr: "127.0.0.1:8428"
    maxConcurrentRequests: "16"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: self-write
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/auth: self-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  tokenRef:
    name: {{ .Values.secrets.write }}
    key: {{ .Values.secrets.tokenKey }}
  disable_secret_creation: true
  targetRefs:
    - static:
        url: {{ printf "http://127.0.0.1:18480/insert/%s/prometheus" (toString .Values.tenantID) | quote }}
      paths:
        - /api/v1/write
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: self-read
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/auth: self-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  tokenRef:
    name: {{ .Values.secrets.read }}
    key: {{ .Values.secrets.tokenKey }}
  disable_secret_creation: true
  targetRefs:
    - static:
        url: {{ printf "http://127.0.0.1:18481/select/%s/prometheus" (toString .Values.tenantID) | quote }}
      paths:
        - /api/v1/query
        - /api/v1/query_range
        - /api/v1/labels
        - /api/v1/label/[^/]+/values
        - /api/v1/series
        - /api/v1/metadata
{{- if (default false (get (default (dict) .Values.grafanaRead) "enabled")) }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: grafana-read
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/auth: self-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  tokenRef: {name: vm-grafana-read, key: token}
  disable_secret_creation: true
  targetRefs:
    - static:
        url: {{ printf "http://127.0.0.1:18481/select/%s/prometheus" (toString .Values.tenantID) | quote }}
      paths:
        - /api/v1/query
        - /api/v1/query_range
        - /api/v1/labels
        - /api/v1/label/[^/]+/values
        - /api/v1/series
        - /api/v1/metadata
{{- end }}
