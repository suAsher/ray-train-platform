apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  {{- include "metrics.common" (dict "root" . "component" "vmauth") | nindent 2 }}
  replicaCount: {{ .Values.auth.replicas }}
  image: {{ toJson .Values.images.auth }}
  imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
  resources: {{ toJson .Values.auth.resources }}
  configReloaderImage: {{ .Values.images.configReloader | quote }}
  configReloaderResources: {{ toJson .Values.configReloaderResources }}
  port: "8427"
  internalListenPort: "8428"
  selectAllByDefault: false
  userSelector:
    matchLabels:
      observability.raytrain.io/auth: self-only
  # Omitted userNamespaceSelector means this CR's namespace only.
  podDisruptionBudget:
    maxUnavailable: 1
  extraArgs:
    maxConcurrentRequests: "16"
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: self-write
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/auth: self-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  tokenRef:
    name: {{ .Values.secrets.write }}
    key: {{ .Values.secrets.tokenKey }}
  disable_secret_creation: true
  targetRefs:
    - static:
        url: {{ printf "http://vminsert-%s.%s.svc:8480/insert/%s/prometheus" .Values.name .Release.Namespace (toString .Values.tenantID) | quote }}
      paths:
        - /api/v1/write
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: self-read
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/auth: self-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  tokenRef:
    name: {{ .Values.secrets.read }}
    key: {{ .Values.secrets.tokenKey }}
  disable_secret_creation: true
  targetRefs:
    - static:
        url: {{ printf "http://vmselect-%s.%s.svc:8481/select/%s/prometheus" .Values.name .Release.Namespace (toString .Values.tenantID) | quote }}
      paths:
        - /api/v1/query
        - /api/v1/query_range
        - /api/v1/labels
        - /api/v1/label/[^/]+/values
        - /api/v1/series
        - /api/v1/metadata
