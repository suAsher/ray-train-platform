apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanager
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/notifier: canary-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  {{- include "metrics.common" (dict "root" . "component" "vmalertmanager") | nindent 2 }}
  replicaCount: {{ .Values.alertmanager.replicas }}
  image: {{ toJson .Values.images.alertmanager }}
  imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
  resources: {{ toJson .Values.alertmanager.resources }}
  configReloaderImage: {{ .Values.images.configReloader | quote }}
  configReloaderResources: {{ toJson .Values.configReloaderResources }}
  port: "9093"
  listenLocal: true
  extraArgs:
    web.listen-address: "127.0.0.1:9093"
  {{- include "metrics.mtls.pod" (dict "root" . "role" "alertmanager" "port" 9093 "reloader" true) | nindent 2 }}
  gossipConfig:
    tls_server_config:
      cert_secret_ref:
        name: obs-mtls-alertmanager-gossip
        key: tls.crt
      key_secret_ref:
        name: obs-mtls-alertmanager-gossip
        key: tls.key
      client_ca_secret_ref:
        name: obs-mtls-alertmanager-gossip
        key: ca.crt
      client_auth_type: RequireAndVerifyClientCert
      min_version: TLS13
    tls_client_config:
      ca_secret_ref:
        name: obs-mtls-alertmanager-gossip
        key: ca.crt
      cert_secret_ref:
        name: obs-mtls-alertmanager-gossip
        key: tls.crt
      key_secret_ref:
        name: obs-mtls-alertmanager-gossip
        key: tls.key
      server_name: {{ printf "alertmanager.%s.svc" .Release.Namespace | quote }}
      insecure_skip_verify: false
  selectAllByDefault: false
  configRawYaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: blackhole-canary
      group_by: [alertname, cluster, telemetry_stage]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 24h
    receivers:
      - name: blackhole-canary
  retention: 120h
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  storage:
    volumeClaimTemplate:
      spec:
        storageClassName: {{ .Values.storageClassName | quote }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.alertmanager.size }}
  podDisruptionBudget:
    maxUnavailable: 1
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  {{- include "metrics.common" (dict "root" . "component" "vmalert") | nindent 2 }}
  replicaCount: {{ .Values.alert.replicas }}
  image: {{ toJson .Values.images.alert }}
  imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
  resources: {{ toJson .Values.alert.resources }}
  configReloaderImage: {{ .Values.images.configReloader | quote }}
  configReloaderResources: {{ toJson .Values.configReloaderResources }}
  port: "8880"
  extraArgs:
    httpListenAddr: "127.0.0.1:8880"
  {{- include "metrics.mtls.pod" (dict "root" . "role" "vmalert" "port" 8880 "reloader" true) | nindent 2 }}
  evaluationInterval: {{ .Values.scrapeInterval }}
  selectAllByDefault: false
  ruleSelector:
    matchLabels:
      observability.raytrain.io/rules: canary-only
  externalLabels:
    cluster: {{ .Values.clusterLabel | quote }}
    telemetry_stage: additive
  datasource:
    url: {{ printf "https://vmauth-%s.%s.svc:8427" .Values.name .Release.Namespace | quote }}
    tlsConfig:
      {{- include "metrics.mtls.client" (dict "role" "vmalert" "peer" "vmauth" "namespace" .Release.Namespace) | nindent 6 }}
    bearerTokenSecret:
      name: {{ .Values.secrets.read }}
      key: {{ .Values.secrets.tokenKey }}
  remoteRead:
    url: {{ printf "https://vmauth-%s.%s.svc:8427" .Values.name .Release.Namespace | quote }}
    tlsConfig:
      {{- include "metrics.mtls.client" (dict "role" "vmalert" "peer" "vmauth" "namespace" .Release.Namespace) | nindent 6 }}
    bearerTokenSecret:
      name: {{ .Values.secrets.read }}
      key: {{ .Values.secrets.tokenKey }}
  remoteWrite:
    url: {{ printf "https://vmauth-%s.%s.svc:8427" .Values.name .Release.Namespace | quote }}
    tlsConfig:
      {{- include "metrics.mtls.client" (dict "role" "vmalert" "peer" "vmauth" "namespace" .Release.Namespace) | nindent 6 }}
    bearerTokenSecret:
      name: {{ .Values.secrets.write }}
      key: {{ .Values.secrets.tokenKey }}
  notifiers:
    {{- range $ordinal := until (int .Values.alertmanager.replicas) }}
    - url: {{ printf "https://vmalertmanager-%s-%d.vmalertmanager-%s.%s.svc:9093" $.Values.name $ordinal $.Values.name $.Release.Namespace | quote }}
      tlsConfig:
        {{- include "metrics.mtls.client" (dict "role" "vmalert" "peer" "alertmanager" "namespace" $.Release.Namespace) | nindent 8 }}
    {{- end }}
  podDisruptionBudget:
    maxUnavailable: 1
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: additive-canary
  namespace: {{ .Release.Namespace }}
  labels:
    observability.raytrain.io/rules: canary-only
    {{- include "metrics.labels" . | nindent 4 }}
spec:
  groups:
    - name: additive-pipeline-canary
      interval: {{ .Values.scrapeInterval }}
      rules:
        - record: raytrain_observability_canary
          expr: vector(1)
          labels:
            purpose: deployment-canary
        - alert: AdditiveObservabilityCanary
          expr: vector(1)
          for: 1m
          labels:
            severity: none
            purpose: deployment-canary
          annotations:
            summary: "New observability pipeline canary; no external notification"
