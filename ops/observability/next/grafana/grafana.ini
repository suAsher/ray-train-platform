[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
root_url = ROOT_URL
[database]
type = postgres
host = grafana-postgres-rw.grafana.svc:5432
name = grafana
user = grafana
ssl_mode = verify-full
ca_cert_path = /etc/postgres-ca/ca.crt
client_cert_path = /etc/postgres-client/tls.crt
client_key_path = /etc/postgres-client/tls.key
max_open_conn = 20
max_idle_conn = 5
conn_max_lifetime = 300
migration_locking = true
locking_attempt_timeout_sec = 120
[security]
cookie_secure = true
cookie_samesite = lax
disable_initial_admin_creation = false
allow_embedding = false
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org_role = Viewer
[auth]
disable_login_form = false
[auth.anonymous]
enabled = false
[auth.proxy]
enabled = false
[auth.basic]
enabled = true
[auth.generic_oauth]
enabled = false
[auth.jwt]
enabled = false
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
[paths]
plugins = /opt/grafana/plugins
provisioning = /etc/grafana/provisioning
[unified_alerting]
enabled = false
[live]
allowed_origins = ALLOWED_ORIGINS
[log]
mode = console
level = warn
[metrics]
enabled = true
