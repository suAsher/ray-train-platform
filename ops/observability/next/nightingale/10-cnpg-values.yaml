# Chart: cloudnative-pg/cloudnative-pg 0.29.1; operator: 1.30.1.
# Install only after checking no conflicting CNPG installation/CRD ownership.
fullnameOverride: cloudnative-pg-operator
replicaCount: 2
image:
  repository: harbor.wellspiking.ai/guofeng.su/cnpg-observability
  # Source candidate c741e72; protocol/upstream tests and build verified on builder.
  # This fixed linux/amd64 manifest contains both injected manager architectures.
  tag: "1.30.1-mtls-c741e72@sha256:53be5d2201b1502aae329b3f64f4b342c897772fb88edde2838e7f7750bc8875"
additionalArgs:
  - --metrics-bind-address=127.0.0.1:8080
additionalEnv:
  - name: OBS_WEBHOOK_API_SERVER_IPS
    value: 172.28.2.64,172.28.5.50
podSecurityContext:
  runAsNonRoot: true
  fsGroup: 10001
  seccompProfile: {type: RuntimeDefault}
config:
  clusterWide: false
  name: cloudnative-pg-operator-config
  data:
    WATCH_NAMESPACE: nightingale
rbac:
  aggregateClusterRoles: false
monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: false
priorityClassName: raytrain-observability-additive
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [172.28.1.222, 172.28.3.32]
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/instance: cloudnative-pg-operator
        topologyKey: kubernetes.io/hostname
tolerations: []
