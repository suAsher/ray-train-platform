containers:
  - name: envoy
    image: harbor.wellspiking.ai/hub/envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
    command: [/usr/local/bin/envoy]
    args: [-c, /etc/envoy/envoy.yaml, --concurrency, "1", --disable-hot-restart, --log-level, warning]
    ports: [{name: mtls-metrics, containerPort: 18443}]
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 300m, memory: 128Mi}
    securityContext:
      runAsNonRoot: true
      runAsUser: 10001
      runAsGroup: 10001
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: {drop: [ALL]}
      seccompProfile: {type: RuntimeDefault}
    readinessProbe:
      tcpSocket: {port: mtls-metrics}
      periodSeconds: 10
    volumeMounts:
      - {name: obs-mtls-identity, mountPath: /etc/obs-mtls, readOnly: true}
      - {name: obs-mtls-config, mountPath: /etc/envoy, readOnly: true}
volumes:
  - name: obs-mtls-identity
    secret: {secretName: obs-mtls-cnpg-operator, defaultMode: 0440}
  - name: obs-mtls-config
    configMap: {name: n9e-cnpg-mtls}
