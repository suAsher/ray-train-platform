        - podSelector:
            matchLabels: {app.kubernetes.io/name: nightingale}
        - podSelector:
            matchLabels: {observability.raytrain.io/nightingale-client: "true"}
      ports: [{port: 6379, protocol: TCP}, {port: 26379, protocol: TCP}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    - to:
        - podSelector:
            matchLabels: {release: n9e-redis}
      ports: [{port: 6379, protocol: TCP}, {port: 26379, protocol: TCP}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: n9e-cnpg-isolated
  namespace: observability-alerting
