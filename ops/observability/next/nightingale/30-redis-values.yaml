# Chart: dandydev/redis-ha 4.39.0. Three Redis+Sentinel Pods.
fullnameOverride: n9e-redis
replicas: 3
image:
  repository: public.ecr.aws/docker/library/redis
  tag: "8.8.0-alpine@sha256:9d317178eceac8454a2284a9e6df2466b93c745529947f0cd42a0fa9609d7005"
  pullPolicy: IfNotPresent
priorityClassName: raytrain-observability-additive
labels:
  app.kubernetes.io/part-of: n9e
  observability.raytrain.io/stage: additive
auth: true
existingSecret: n9e-redis-auth
authKey: auth
redis:
  port: 0
  tlsPort: 6379
  tlsReplication: true
  authClients: "yes"
  masterGroupName: n9e
  config:
    min-replicas-to-write: 1
    min-replicas-max-lag: 5
    maxmemory: 384mb
    maxmemory-policy: noeviction
    appendonly: "yes"
    appendfsync: everysec
    save: "900 1"
    repl-diskless-sync: "yes"
    rdbcompression: "yes"
    rdbchecksum: "yes"
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
sentinel:
  port: 0
  tlsPort: 26379
  tlsReplication: true
  authClients: "yes"
  resolveHostnames: true
  announceHostnames: true
  auth: true
  existingSecret: n9e-redis-auth
  authKey: sentinel-password
  quorum: 2
  config:
    down-after-milliseconds: 10000
    failover-timeout: 180000
    parallel-syncs: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
splitBrainDetection:
  resources:
    requests: {cpu: 20m, memory: 32Mi}
    limits: {cpu: 100m, memory: 64Mi}
init:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 250m, memory: 128Mi}
persistentVolume:
  enabled: true
  storageClass: ebs-ssd-observability-retain
  size: 20Gi
hardAntiAffinity: true
additionalAffinities:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values: [172.28.1.222, 172.28.3.32]
tolerations: []
podDisruptionBudget:
  minAvailable: 2
serviceAccount:
  create: true
  automountToken: false
sysctlImage:
  enabled: false
haproxy:
  enabled: false
exporter:
  enabled: false
tls:
  secretName: obs-mtls-redis-ha-peer
  certFile: tls.crt
  keyFile: tls.key
  caCertFile: ca.crt
# The chart does not expose test Pod priority/affinity. Do not run helm test;
# use --skip-tests when rendering the deployment review (see README).
configmapTest:
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 128Mi}
