# Apply only after the dedicated PostgreSQL cluster is Ready and seed ConfigMap exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: n9e-bootstrap-v911
  namespace: observability-alerting
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n9e-bootstrap
        observability.raytrain.io/stage: additive
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      priorityClassName: raytrain-observability-additive
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [172.28.1.222, 172.28.3.32]
      containers:
        - name: seed
          image: harbor.wellspiking.ai/guofeng.su/postgresql-observability:17.11-202608170816-source-6b7e6a12@sha256:6b7e6a1267254902840efa9936bbeb0a398a79b5b9cb2e82218e4a92b602e97c
          command: [sh, -ec]
          args:
            - |
              test "${#N9E_ADMIN_PASSWORD}" -eq 24
              exec psql -X --quiet --set ON_ERROR_STOP=1 --single-transaction --file /seed/seed.sql
          env:
            - {name: PGHOST, value: n9e-postgres-rw.observability-alerting.svc}
            - {name: PGDATABASE, value: n9e}
            - {name: PGSSLMODE, value: verify-full}
            - {name: PGSSLROOTCERT, value: /etc/n9e-pg-mtls/ca.crt}
            - {name: PGSSLCERT, value: /etc/n9e-pg-mtls/tls.crt}
            - {name: PGSSLKEY, value: /etc/n9e-pg-mtls/tls.key}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: n9e-db-app, key: username}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: n9e-db-app, key: password}
            - name: N9E_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: n9e-bootstrap-admin, key: password}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: seed, mountPath: /seed, readOnly: true}
            - {name: pg-mtls, mountPath: /etc/n9e-pg-mtls, readOnly: true}
      volumes:
        - name: seed
          configMap: {name: n9e-postgres-seed-v911}
        - name: pg-mtls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: n9e-postgres-ca
                  items: [{key: ca.crt, path: ca.crt}]
              - secret:
                  name: obs-mtls-n9e-postgres-bootstrap
                  items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
