apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightingale
  namespace: nightingale
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: nightingale
  namespace: nightingale
  labels:
    app.kubernetes.io/name: nightingale
    observability.raytrain.io/stage: additive
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: nightingale}
  ports: [{name: https, port: 17443, targetPort: mtls}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nightingale
  namespace: nightingale
spec:
  # First bootstrap must complete on one instance; apply 50-ha-patch.yaml afterwards.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: nightingale}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nightingale
        app.kubernetes.io/part-of: n9e
        observability.raytrain.io/stage: additive
        observability.raytrain.io/metrics-client: "true"
    spec:
      serviceAccountName: nightingale
      automountServiceAccountToken: false
      priorityClassName: raytrain-observability-additive
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values: [172.28.1.222, 172.28.3.32]
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: {app.kubernetes.io/name: nightingale}
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: render-config
          image: harbor.wellspiking.ai/guofeng.su/nightingale-observability:9.1.1-sentinel-01abc76@sha256:2e544213530f914b961e05d9fbab2ddcbbb995402379496a34815f0d61da6315
          command: [python3, /config/render-config.py]
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config-template, mountPath: /config, readOnly: true}
            - {name: config-runtime, mountPath: /run/n9e}
            - {name: db-auth, mountPath: /secrets/db, readOnly: true}
            - {name: redis-auth, mountPath: /secrets/redis, readOnly: true}
      containers:
        - name: nightingale
          image: harbor.wellspiking.ai/guofeng.su/nightingale-observability:9.1.1-sentinel-01abc76@sha256:2e544213530f914b961e05d9fbab2ddcbbb995402379496a34815f0d61da6315
          command: [/app/n9e]
          args: [-configs, /run/n9e/etc]
          workingDir: /app
          resources:
            requests: {cpu: 500m, memory: 1Gi, ephemeral-storage: 256Mi}
            limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            exec:
              command: [python3, -c, "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:17000/ping', timeout=2); assert r.status == 200 and r.read() == b'pong'"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: [python3, -c, "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:17000/ping', timeout=2); assert r.status == 200 and r.read() == b'pong'"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: [python3, -c, "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:17000/ping', timeout=2); assert r.status == 200 and r.read() == b'pong'"]
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - {name: config-runtime, mountPath: /run/n9e, readOnly: true}
            - {name: pg-mtls, mountPath: /etc/n9e-pg-mtls, readOnly: true}
            - {name: redis-mtls, mountPath: /etc/n9e-redis-mtls, readOnly: true}
            - {name: logs, mountPath: /var/log/n9e}
            - {name: tmp, mountPath: /tmp}
        - name: envoy
          image: harbor.wellspiking.ai/hub/envoyproxy/envoy:v1.39.3@sha256:dd85940439de19a0b6ae8419610363ea0ad351d9a994ea007161c206ec1e1865
          command: [/usr/local/bin/envoy]
          args: [-c, /etc/envoy/envoy.yaml, --concurrency, "1", --disable-hot-restart, --log-level, warning]
          ports: [{name: mtls, containerPort: 17443}]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 300m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            tcpSocket: {port: mtls}
            periodSeconds: 10
          volumeMounts:
            - {name: config-template, mountPath: /etc/envoy, readOnly: true}
            - {name: mesh-mtls, mountPath: /etc/obs-mtls, readOnly: true}
      volumes:
        - name: config-template
          configMap: {name: n9e-config-v911}
        - name: config-runtime
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
        - name: db-auth
          secret:
            secretName: n9e-db-app
            defaultMode: 0440
        - name: redis-auth
          secret:
            secretName: nightingale-redis-auth
            defaultMode: 0440
        - name: pg-mtls
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: nightingale-postgres-ca
                  items: [{key: ca.crt, path: ca.crt}]
              - secret:
                  name: obs-mtls-n9e-postgres-client
                  items: [{key: tls.crt, path: tls.crt}, {key: tls.key, path: tls.key}]
        - name: redis-mtls
          secret: {secretName: obs-mtls-nightingale-redis, defaultMode: 0440}
        - name: mesh-mtls
          secret: {secretName: obs-mtls-nightingale, defaultMode: 0440}
        - name: logs
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nightingale
  namespace: nightingale
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: nightingale}
