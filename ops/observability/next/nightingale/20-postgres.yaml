apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nightingale-postgres
  namespace: nightingale
  labels:
    observability.raytrain.io/stage: additive
spec:
  instances: 3
  imageName: harbor.wellspiking.ai/guofeng.su/postgresql-observability:17.11-202608170816-source-6b7e6a12@sha256:6b7e6a1267254902840efa9936bbeb0a398a79b5b9cb2e82218e4a92b602e97c
  enableSuperuserAccess: false
  priorityClassName: raytrain-observability-additive
  primaryUpdateStrategy: supervised
  certificates:
    clientCASecret: obs-mtls-postgres-client-ca
    replicationTLSSecret: obs-mtls-n9e-postgres-replication
  env:
    - name: OBS_METRICS_CLIENT_CA_FILE
      value: /projected/obs-metrics/ca.crt
    - name: OBS_METRICS_ALLOWED_CLIENT_URIS
      value: spiffe://observability.raytrain.local/victoriametrics/vmagent
  projectedVolumeTemplate:
    sources:
      - secret:
          name: obs-mtls-cnpg-metrics-ca
          items: [{key: ca.crt, path: obs-metrics/ca.crt}]
  bootstrap:
    initdb:
      database: n9e
      owner: n9e
      secret:
        name: n9e-db-app
      encoding: UTF8
      localeCType: C
      localeCollate: C
  postgresql:
    pg_hba:
      - hostnossl all all all reject
      - hostssl n9e n9e all scram-sha-256 clientcert=verify-full
      # N9E 9.1.1 checks pg_database through dbname=postgres before opening n9e.
      - hostssl postgres n9e all scram-sha-256 clientcert=verify-full
      - hostssl all all all reject
    parameters:
      max_connections: "100"
      shared_buffers: 256MB
      log_statement: none
      log_min_error_statement: panic
    synchronous:
      method: any
      number: 1
      dataDurability: required
      failoverQuorum: true
  storage:
    storageClass: ebs-ssd-observability-retain
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values: [172.28.1.222, 172.28.3.32]
    # Omit an empty slice: CNPG 1.30.1 compares [] against the nil value
    # decoded from its omitempty PodSpec annotation and otherwise rolls forever.
  monitoring:
    enablePodMonitor: false
    tls:
      enabled: true
