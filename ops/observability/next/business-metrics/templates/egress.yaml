{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-wave1-vmagent-exporters
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "business.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      observability.raytrain.io/component: vmagent
  policyTypes: [Egress]
  egress:
    {{- range .Values.targets }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml .podLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
{{- end }}
