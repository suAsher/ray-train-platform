{{- include "business.guard" . -}}
{{- range .Values.targets }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: business-wave1-{{ .component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "business.labels" $ | nindent 4 }}
    observability.raytrain.io/scrape: business-wave1
    observability.raytrain.io/target: {{ .component }}
spec:
  namespaceSelector:
    matchNames: [{{ .namespace | quote }}]
  selector:
    matchLabels:
      {{- toYaml .serviceLabels | nindent 6 }}
  endpoints:
    - port: {{ .portName | quote }}
      path: /metrics
      scheme: http
      interval: {{ $.Values.scrapeInterval }}
      scrapeTimeout: {{ $.Values.scrapeTimeout }}
      honorLabels: false
      relabelConfigs:
        {{- include "business.targetRelabelings" . | nindent 8 }}
      metricRelabelConfigs:
        {{- include "business.metricRelabelings" . | nindent 8 }}
{{- if .prometheusMonitor }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: business-wave1-{{ .component }}
  namespace: {{ $.Values.prometheusNamespace }}
  labels:
    {{- include "business.labels" $ | nindent 4 }}
    observability.raytrain.io/target: {{ .component }}
spec:
  namespaceSelector:
    matchNames: [{{ .namespace | quote }}]
  selector:
    matchLabels:
      {{- toYaml .serviceLabels | nindent 6 }}
  endpoints:
    - port: {{ .portName | quote }}
      path: /metrics
      scheme: http
      interval: {{ $.Values.scrapeInterval }}
      scrapeTimeout: {{ $.Values.scrapeTimeout }}
      honorLabels: false
      relabelings:
        {{- include "business.targetRelabelings" . | nindent 8 }}
      metricRelabelings:
        {{- include "business.metricRelabelings" . | nindent 8 }}
{{- end }}
{{- end }}
