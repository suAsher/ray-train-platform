{{- range $namespace := list "kube-system" "monitoring" "loki" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: business-wave1-vm-discovery
  namespace: {{ $namespace }}
  labels:
    {{- include "business.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: business-wave1-vm-discovery
  namespace: {{ $namespace }}
  labels:
    {{- include "business.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: business-wave1-vm-discovery
subjects:
  - kind: ServiceAccount
    name: {{ $.Values.scraperServiceAccount | quote }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
