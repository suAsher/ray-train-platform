apiVersion: v1
kind: ConfigMap
metadata:
  name: raytrain-observability-wave1-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: raytrain-observability-next
    observability.raytrain.io/wave: business-wave1
    observability.raytrain.io/scope: business-wave1
data:
  raytrain-observability-wave1.json: |
    {
      "uid": "raytrain-observability-wave1",
      "title": "RayTrain · 日志链路与 GPU 业务",
      "description": "首批业务可观测性：数据源为原 Prometheus。Alloy/Loki 自监控与现有 GPU、Kubernetes 指标共同展示；VMCluster 已并行接入，Grafana 的 VM 专属只读身份后续配置。正式告警统一由夜莺管理，通知渠道由管理员在夜莺 UI 配置。本看板不创建或发送告警。N/A 表示缺采、无匹配指标或无请求，需结合目标 UP 判断。",
      "tags": ["raytrain", "observability", "business-wave1"],
      "editable": false,
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "timezone": "browser",
      "time": {"from": "now-6h", "to": "now"},
      "timepicker": {"refresh_intervals": ["30s", "1m", "5m"]},
      "annotations": {"list": []},
      "templating": {"list": []},
      "panels": [
        {
          "id": 1, "type": "text", "title": "首批接入范围与数据口径",
          "gridPos": {"x": 0, "y": 0, "w": 24, "h": 4},
          "options": {"mode": "markdown", "content": "**当前数据源：原 Prometheus** · 每 30 秒刷新 · 正式告警统一在夜莺配置\n\n日志链路继续使用 **Alloy → Loki → TOS**；此页新增链路健康、GPU、节点及后端工作负载指标。计数器展示最近 5 分钟的速率或增量。**N/A** 表示缺采、无匹配指标或无请求；先结合目标 UP 判断。Loki 拒收按 Pod 展示，可能含副本处理或重试，不能相加解释为业务唯一丢失日志。\n\nAPI 延迟、训练排队耗时、同步吞吐和业务 Trace 尚待代码埋点；当前后端面板展示 Kubernetes 工作负载状态。"}
        },
        {
          "id": 2, "type": "row", "title": "01  日志采集 · Alloy",
          "collapsed": false, "panels": [], "gridPos": {"x": 0, "y": 4, "w": 24, "h": 1}
        },
        {
          "id": 3, "type": "stat", "title": "Alloy 采集目标 UP",
          "description": "Prometheus 对每个 Alloy Pod 的抓取状态。1 为成功，0 为抓取失败；目标未发现时为 N/A。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 5, "w": 6, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "min by (pod) (up{telemetry_scope=\"business-wave1\",component=\"alloy\"})", "instant": true, "legendFormat": "{{pod}}"}]
        },
        {
          "id": 4, "type": "stat", "title": "Loki 采集目标 UP",
          "description": "Prometheus 对每个 Loki Pod 的抓取状态；这不等同于实际写入或查询成功。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 6, "y": 5, "w": 6, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "max": 1, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "min by (pod) (up{telemetry_scope=\"business-wave1\",component=\"loki\"})", "instant": true, "legendFormat": "{{pod}}"}]
        },
        {
          "id": 5, "type": "stat", "title": "Alloy 集群接流量就绪",
          "description": "Alloy 原生 cluster_ready_for_traffic；需要同时观察目标 UP 与实际日志发送情况。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 5, "w": 6, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "max": 1}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "min by (pod) (cluster_ready_for_traffic{telemetry_scope=\"business-wave1\",component=\"alloy\"})", "instant": true, "legendFormat": "{{pod}}"}]
        },
        {
          "id": 6, "type": "stat", "title": "Alloy 成员视图",
          "description": "各 Alloy Pod 看到的 participant 成员数；当前期望为 2。该数值不代表采集吞吐或日志完整性。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 18, "y": 5, "w": 6, "h": 4},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "colorMode": "value", "graphMode": "none"},
          "targets": [{"refId": "A", "expr": "max by (pod) (cluster_node_peers{telemetry_scope=\"business-wave1\",component=\"alloy\",state=\"participant\"})", "instant": true, "legendFormat": "{{pod}}"}]
        },
        {
          "id": 7, "type": "timeseries", "title": "Alloy 发送日志速率",
          "description": "各采集 Pod 最近 5 分钟成功发送速率。包含集群内采集范围中的日志，不只训练任务。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 9, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "ops", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(loki_write_sent_entries_total{telemetry_scope=\"business-wave1\",component=\"alloy\"}[5m]))", "legendFormat": "{{pod}} 条/秒"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "Alloy 最近 5 分钟批次重试",
          "description": "批次重试的窗口增量；不是丢失条数，也不是进程启动以来的历史总数。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 9, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (increase(loki_write_batch_retries_total{telemetry_scope=\"business-wave1\",component=\"alloy\"}[5m]))", "legendFormat": "{{pod}} 批次"}]
        },
        {
          "id": 9, "type": "timeseries", "title": "Alloy 最近 5 分钟丢弃 · 按原因",
          "description": "按采集 Pod 与原因查看写入组件丢弃增量。多个原因与 Loki 拒收不能重复相加为唯一业务日志损失。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 16, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod, reason) (increase(loki_write_dropped_entries_total{telemetry_scope=\"business-wave1\",component=\"alloy\"}[5m]))", "legendFormat": "{{pod}} · {{reason}}"}]
        },
        {
          "id": 10, "type": "timeseries", "title": "Alloy 日志传播延迟 p95",
          "description": "原生 entry propagation 直方图的 5 分钟 p95；包含日志时间戳到传播时刻的差异，受历史日志与时钟影响。无观察样本时为 N/A。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 16, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "s", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(loki_write_entry_propagation_latency_seconds_bucket{telemetry_scope=\"business-wave1\",component=\"alloy\"}[5m])))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 11, "type": "timeseries", "title": "Alloy 进程 CPU",
          "description": "Alloy 进程 CPU 使用核数，按 5 分钟平均速率；不包含 Pod 中其他进程，不代表资源申请或上限。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 23, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "cores", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(process_cpu_seconds_total{telemetry_scope=\"business-wave1\",component=\"alloy\"}[5m]))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 12, "type": "timeseries", "title": "Alloy 进程常驻内存 RSS",
          "description": "进程常驻内存，不等同于 cgroup working set，也不包含磁盘队列空间。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 23, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "bytes", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max by (pod) (process_resident_memory_bytes{telemetry_scope=\"business-wave1\",component=\"alloy\"})", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 13, "type": "row", "title": "02  日志存储 · Loki 写入链路",
          "collapsed": false, "panels": [], "gridPos": {"x": 0, "y": 30, "w": 24, "h": 1}
        },
        {
          "id": 14, "type": "timeseries", "title": "Loki 接收吞吐",
          "description": "各 distributor 最近 5 分钟接收字节速率；按 Pod 展示，不以 ingester 副本写入量推断唯一日志量。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 31, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "Bps", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (rate(loki_distributor_bytes_received_total{telemetry_scope=\"business-wave1\",component=\"loki\"}[5m]))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 15, "type": "timeseries", "title": "Loki 写入请求 · 429 / 5xx",
          "description": "仅 push 路由的限流和服务端错误速率。若从未出现该状态码，原生指标可能不建立对应序列，此时 N/A 不等于确认无故障；结合目标 UP、写入量及丢弃指标判断。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 31, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "reqps", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod, status_code) (rate(loki_request_duration_seconds_count{telemetry_scope=\"business-wave1\",component=\"loki\",route=\"loki_api_v1_push\",status_code=~\"429|5..\"}[5m]))", "legendFormat": "{{pod}} · HTTP {{status_code}}"}]
        },
        {
          "id": 16, "type": "timeseries", "title": "Loki 写入请求延迟 p95",
          "description": "各 Pod push 路由最近 5 分钟请求延迟 p95，包含该路由各状态码；无写入请求时为 N/A。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 38, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "s", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (pod, le) (rate(loki_request_duration_seconds_bucket{telemetry_scope=\"business-wave1\",component=\"loki\",route=\"loki_api_v1_push\"}[5m])))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 17, "type": "timeseries", "title": "Loki 最近 5 分钟拒收 · 按 Pod 与原因",
          "description": "原生 discarded samples 的窗口增量。副本处理、重试可能重复计数，不能相加为唯一业务日志丢失条数；与 Alloy 丢弃亦不可累加。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 38, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod, reason) (increase(loki_discarded_samples_total{telemetry_scope=\"business-wave1\",component=\"loki\"}[5m]))", "legendFormat": "{{pod}} · {{reason}}"}]
        },
        {
          "id": 18, "type": "timeseries", "title": "Loki Flush 队列",
          "description": "每个 Pod 等待刷写的队列长度；持续堆积时结合存储请求、失败增量与资源使用排查。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 45, "w": 8, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (loki_ingester_flush_queue_length{telemetry_scope=\"business-wave1\",component=\"loki\"})", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 19, "type": "timeseries", "title": "Loki 最近 5 分钟 Flush 失败",
          "description": "各 Pod chunk flush 失败计数器的窗口增量；失败可能被重试，不等于永久数据丢失。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 8, "y": 45, "w": 8, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (increase(loki_ingester_chunks_flush_failures_total{telemetry_scope=\"business-wave1\",component=\"loki\"}[5m]))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 20, "type": "timeseries", "title": "Loki 最近 5 分钟 WAL 磁盘满",
          "description": "各 Pod WAL 写入因磁盘满而失败的窗口增量；这是运行时失败事件，非 PVC 或 TOS 容量百分比。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 16, "y": 45, "w": 8, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "sum by (pod) (increase(loki_ingester_wal_disk_full_failures_total{telemetry_scope=\"business-wave1\",component=\"loki\"}[5m]))", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 21, "type": "row", "title": "03  训练业务 · GPU、节点与控制面",
          "collapsed": false, "panels": [], "gridPos": {"x": 0, "y": 52, "w": 24, "h": 1}
        },
        {
          "id": 22, "type": "timeseries", "title": "每节点每 GPU 利用率",
          "description": "原 DCGM exporter 指标；Hostname 是物理节点，instance 是 exporter Pod IP。按物理节点和 GPU 区分，不将低利用率自动判为训练异常。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 53, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "percent", "noValue": "N/A", "min": 0, "max": 100, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max by (Hostname, gpu) (DCGM_FI_DEV_GPU_UTIL{job=\"dcgm-exporter\"})", "legendFormat": "{{Hostname}} · GPU {{gpu}}"}]
        },
        {
          "id": 23, "type": "timeseries", "title": "每节点每 GPU 显存已用",
          "description": "DCGM FB_USED 的 MiB 转为字节展示；显存占用并不直接等于用户当前正在进行计算。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 12, "y": 53, "w": 12, "h": 7},
          "fieldConfig": {"defaults": {"unit": "bytes", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max by (Hostname, gpu) (DCGM_FI_DEV_FB_USED{job=\"dcgm-exporter\"}) * 1048576", "legendFormat": "{{Hostname}} · GPU {{gpu}}"}]
        },
        {
          "id": 24, "type": "timeseries", "title": "后端 Pod Ready",
          "description": "现有 kube-state-metrics 中 RayTrain backend Pod 的 Ready 条件。仅说明工作负载状态，不能替代 API 请求成功率或延迟。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 0, "y": 60, "w": 8, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "max": 1, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max by (pod) (kube_pod_status_ready{job=\"kube-state-metrics\",namespace=\"ray-train-platform\",pod=~\"ray-train-backend-.+\",condition=\"true\"})", "legendFormat": "{{pod}}"}]
        },
        {
          "id": 25, "type": "timeseries", "title": "后端容器最近 5 分钟重启",
          "description": "原 kube-state-metrics 的 backend 容器重启窗口增量。Pod 被替换不一定增加该计数，结合 Ready 曲线及发布记录判断。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 8, "y": 60, "w": 8, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max by (pod, container) (increase(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\",namespace=\"ray-train-platform\",pod=~\"ray-train-backend-.+\",container=\"backend\"}[5m]))", "legendFormat": "{{pod}} · {{container}}"}]
        },
        {
          "id": 26, "type": "timeseries", "title": "VKE 节点 Ready",
          "description": "各节点的 Ready=true 状态。1 为就绪，0 为非就绪；节点压力、GPU 驱动或网络问题仍需其他指标进一步判断。",
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "gridPos": {"x": 16, "y": 60, "w": 8, "h": 7},
          "fieldConfig": {"defaults": {"unit": "short", "noValue": "N/A", "min": 0, "max": 1, "custom": {"spanNulls": false}}, "overrides": []},
          "targets": [{"refId": "A", "expr": "max by (node) (kube_node_status_condition{job=\"kube-state-metrics\",condition=\"Ready\",status=\"true\"})", "legendFormat": "{{node}}"}]
        }
      ]
    }
