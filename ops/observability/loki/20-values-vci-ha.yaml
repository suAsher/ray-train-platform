# Production Loki for the VKE control plane.
#
# - TOS is Loki's TSDB object storage. It is not mounted as a PVC.
# - Every Loki replica owns one RWO EBS PVC for WAL and local working data.
# - VCI does not use the ECS containerd mirror, therefore every image below
#   resolves directly through the internal Harbor proxy.
# - The only credentials are injected from the pre-existing loki-tos Secret.

deploymentMode: Monolithic

global:
  imageRegistry: harbor.wellspiking.ai/hub
  imagePullSecrets: []

defaults:
  extraEnvFrom:
    - secretRef:
        name: loki-tos

loki:
  auth_enabled: false
  image:
    repository: grafana/loki
    tag: "3.7.6"
    pullPolicy: IfNotPresent
  storage:
    type: s3
    bucketNames:
      chunks: vke-cluster
      ruler: vke-cluster
      admin: vke-cluster
    s3:
      endpoint: tos-s3-cn-shanghai.ivolces.com
      region: cn-shanghai
      accessKeyId: ${TOS_ACCESS_KEY_ID}
      secretAccessKey: ${TOS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: false
      insecure: false
  schemaConfig:
    configs:
      # Alloy begins tailing retained Pod logs when it starts. Keep the first
      # schema before the platform's existing workload logs, otherwise Loki
      # rejects those historical timestamps with "no schema config found".
      - from: "2026-08-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 3
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    retention_period: 720h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
  compactor:
    retention_enabled: true
    delete_request_store: s3
    working_directory: /var/loki/retention

singleBinary:
  enabled: true
  kind: StatefulSet
  replicas: 3
  podManagementPolicy: Parallel
  terminationGracePeriodSeconds: 120
  podAnnotations:
    vke.volcengine.com/burst-to-vci: enforce
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: [virtual-node]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: single-binary
              app.kubernetes.io/instance: loki
              app.kubernetes.io/name: loki
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: single-binary
          app.kubernetes.io/instance: loki
          app.kubernetes.io/name: loki
  tolerations:
    - key: vci.vke.volcengine.com/node-type
      operator: Exists
  persistence:
    enabled: true
    accessModes: [ReadWriteOnce]
    storageClass: ebs-ssd
    size: 50Gi
    whenScaled: Retain
    whenDeleted: Retain
    enableStatefulSetAutoDeletePVC: false
    labels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki
      app.kubernetes.io/component: single-binary
  initContainers:
    - name: initialize-wal-permissions
      image: harbor.wellspiking.ai/hub/library/busybox:1.36
      imagePullPolicy: IfNotPresent
      command: ["sh", "-ec"]
      args:
        - |-
          chown 10001:10001 /var/loki
          chmod 0770 /var/loki
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
          add: ["CHOWN"]
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 50m
          memory: 64Mi
      volumeMounts:
        - name: storage
          mountPath: /var/loki

# Disable every target that belongs to the deprecated Simple Scalable or
# distributed modes. The chart validates replica counts even when a target is
# disabled, so retain explicit zeroes.
write:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
backend:
  enabled: false
  replicas: 0

gateway:
  enabled: true
  replicas: 2
  # The chart's optional access-log exporter is not mirrored by the internal
  # Harbor proxy. Gateway request metrics are non-critical for v1; disabling
  # only this sidecar keeps the production log ingestion/query path available.
  metrics:
    enabled: false
  podAnnotations:
    vke.volcengine.com/burst-to-vci: enforce
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31-alpine
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node.kubernetes.io/instance-type
                operator: In
                values: [virtual-node]
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
              app.kubernetes.io/instance: loki
              app.kubernetes.io/name: loki
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway
          app.kubernetes.io/instance: loki
          app.kubernetes.io/name: loki
  tolerations:
    - key: vci.vke.volcengine.com/node-type
      operator: Exists
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false

minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
