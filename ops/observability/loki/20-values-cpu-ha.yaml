# CPU-node Loki cluster. Historical chunks and indexes remain in TOS; this
# release intentionally has a new name so the old VCI StatefulSet PVCs remain
# untouched during the migration.
deploymentMode: Monolithic

# The old VCI release is intentionally retained at replicas=0 with its PVCs
# preserved. Give the CPU release a fully independent resource namespace so
# chart-level ConfigMaps, Services and StatefulSets cannot collide.
nameOverride: loki-cpu
fullnameOverride: loki-cpu

global:
  imageRegistry: harbor.wellspiking.ai/hub
  imagePullSecrets: []

defaults:
  extraEnvFrom:
    - secretRef:
        name: loki-tos

loki:
  configObjectName: loki-cpu
  generatedConfigObjectName: loki-cpu
  auth_enabled: false
  image:
    repository: grafana/loki
    tag: "3.7.6"
    pullPolicy: IfNotPresent
  storage:
    type: s3
    bucketNames:
      chunks: vke-cluster
      ruler: vke-cluster
      admin: vke-cluster
    s3:
      endpoint: tos-s3-cn-shanghai.ivolces.com
      region: cn-shanghai
      accessKeyId: ${TOS_ACCESS_KEY_ID}
      secretAccessKey: ${TOS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: false
      insecure: false
  schemaConfig:
    configs:
      - from: "2026-08-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 3
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    retention_period: 720h
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: 10MB
    per_stream_rate_limit_burst: 20MB
  compactor:
    retention_enabled: true
    delete_request_store: s3
    working_directory: /var/loki/retention

singleBinary:
  enabled: true
  kind: StatefulSet
  replicas: 3
  podManagementPolicy: Parallel
  terminationGracePeriodSeconds: 120
  nodeSelector:
    platform.wellspiking.ai/pool: control-plane
  podDisruptionBudget:
    enabled: true
    minAvailable: 2
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: single-binary
              app.kubernetes.io/instance: loki-cpu
              app.kubernetes.io/name: loki-cpu
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: single-binary
          app.kubernetes.io/instance: loki-cpu
          app.kubernetes.io/name: loki-cpu
  tolerations: []
  # VKE CPU nodes enforce runAsNonRoot. Kubernetes applies fsGroup to a fresh
  # EBS volume before Loki starts, so no root chown init container is needed.
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  persistence:
    enabled: true
    accessModes: [ReadWriteOnce]
    storageClass: ebs-ssd
    size: 50Gi
    whenScaled: Retain
    whenDeleted: Retain
    enableStatefulSetAutoDeletePVC: false
    labels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: loki-cpu
      app.kubernetes.io/component: single-binary
  initContainers: []

write:
  enabled: false
  replicas: 0
read:
  enabled: false
  replicas: 0
backend:
  enabled: false
  replicas: 0

gateway:
  enabled: true
  replicas: 2
  # Nginx resolves Loki's backend Service dynamically. Disable IPv6 lookups:
  # this VKE cluster has an IPv4-only Service network and AAAA resolution can
  # otherwise stall Portal log requests behind the gateway timeout.
  nginxConfig:
    resolver: kube-dns.kube-system.svc.cluster.local valid=30s ipv6=off
  metrics:
    enabled: false
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.31-alpine
    pullPolicy: IfNotPresent
  nodeSelector:
    platform.wellspiking.ai/pool: control-plane
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/component: gateway
              app.kubernetes.io/instance: loki-cpu
              app.kubernetes.io/name: loki-cpu
          topologyKey: kubernetes.io/hostname
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: gateway
          app.kubernetes.io/instance: loki-cpu
          app.kubernetes.io/name: loki-cpu
  tolerations: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
  ingress:
    enabled: false

minio:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
