apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mlflow-fsx-probe
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-fsx-probe
    app.kubernetes.io/part-of: ray-train-platform
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-fsx-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-fsx-probe
        app.kubernetes.io/part-of: ray-train-platform
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        platform.wellspiking.ai/pool: control-plane
      containers:
        - name: probe
          image: harbor.wellspiking.ai/hub/nginxinc/nginx-unprivileged@sha256:c3fed6436b61d2bf2201ec032c35c000871f7ed062dea5d586bc6bf4d0fdd140
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while true; do
                rm -f /health/ready
                if timeout 10 /bin/sh -ec '
                  directory=/mlflow-artifacts/.platform-health
                  probe="${directory}/${NODE_NAME}-${POD_NAME}.tmp"
                  mkdir -p "$directory"
                  stat "$directory" >/dev/null
                  trap '\''rm -f "$probe"'\'' EXIT HUP INT TERM
                  printf "%s\n" "$(date -u +%FT%TZ)" >"$probe"
                  test -s "$probe"
                  rm -f "$probe"
                  trap - EXIT HUP INT TERM
                '; then
                  date +%s >/health/ready
                else
                  echo "FSX read/write/delete probe failed on ${NODE_NAME}" >&2
                fi
                sleep 20
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -s /health/ready
                  now="$(date +%s)"
                  last="$(cat /health/ready)"
                  test "$((now - last))" -le 60
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: artifacts
              mountPath: /mlflow-artifacts
            - name: health
              mountPath: /health
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-irsa
        - name: health
          emptyDir: {}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mlflow-fsx-dns-probe
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-fsx-dns-probe
    app.kubernetes.io/part-of: ray-train-platform
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-fsx-dns-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-fsx-dns-probe
        app.kubernetes.io/part-of: ray-train-platform
    spec:
      automountServiceAccountToken: false
      dnsPolicy: Default
      terminationGracePeriodSeconds: 5
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        platform.wellspiking.ai/pool: control-plane
      containers:
        - name: probe
          image: harbor.wellspiking.ai/hub/nginxinc/nginx-unprivileged@sha256:c3fed6436b61d2bf2201ec032c35c000871f7ed062dea5d586bc6bf4d0fdd140
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while true; do
                rm -f /health/ready
                if timeout 15 /bin/sh -ec '
                  for endpoint in tos-cn-shanghai.ivolces.com shanghai-data-transfer.tos-cn-shanghai.ivolces.com; do
                    getent ahostsv4 "$endpoint" | grep -Eq "100\\.(64|96)\\."
                  done
                '; then
                  date +%s >/health/ready
                else
                  echo "effective FSX DNS resolution failed on ${NODE_NAME}" >&2
                fi
                for resolver in 192.168.110.61 192.168.111.63 100.96.0.2 100.96.0.3; do
                  resolver_ok=true
                  for endpoint in tos-cn-shanghai.ivolces.com shanghai-data-transfer.tos-cn-shanghai.ivolces.com; do
                    if ! timeout 5 nslookup "$endpoint" "$resolver" >/dev/null 2>&1; then
                      resolver_ok=false
                    fi
                  done
                  if ! "$resolver_ok"; then
                    echo "FSX DNS resolver ${resolver} is degraded on ${NODE_NAME}" >&2
                  fi
                done
                sleep 20
              done
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - |
                  test -s /health/ready
                  now="$(date +%s)"
                  last="$(cat /health/ready)"
                  test "$((now - last))" -le 75
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: health
              mountPath: /health
      volumes:
        - name: health
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-fsx-probe
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-fsx-probe
    app.kubernetes.io/part-of: ray-train-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-fsx-probe
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-fsx-dns-probe
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-fsx-dns-probe
    app.kubernetes.io/part-of: ray-train-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-fsx-dns-probe
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - ipBlock:
            cidr: 192.168.110.61/32
        - ipBlock:
            cidr: 192.168.111.63/32
        - ipBlock:
            cidr: 100.96.0.2/32
        - ipBlock:
            cidr: 100.96.0.3/32
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mlflow-fsx-probe
  namespace: mlflow-system
  labels:
    release: prometheus
    app.kubernetes.io/name: mlflow-fsx-probe
    app.kubernetes.io/part-of: ray-train-platform
spec:
  groups:
    - name: mlflow-fsx.rules
      rules:
        - alert: MLflowFSXMountUnavailable
          expr: sum((kube_pod_status_ready{namespace="mlflow-system",pod=~"mlflow-fsx-probe-.*",condition="true"} == 0) and on(namespace,pod) (kube_pod_status_scheduled{namespace="mlflow-system",pod=~"mlflow-fsx-probe-.*",condition="true"} == 1)) > 0
          for: 2m
          labels:
            severity: critical
            service: mlflow
          annotations:
            summary: MLflow FSX mount is unavailable on one or more control-plane nodes
            description: The node-level probe cannot complete a bounded stat/write/delete cycle. Check mlflow-fsx-probe Pod events, csi-fsx-node logs, and fsx-agent recovery state before restarting workloads.
        - alert: MLflowFSXProbeUnschedulable
          expr: max(kube_pod_status_unschedulable{namespace="mlflow-system",pod=~"mlflow-fsx-probe-.*"}) > 0
          for: 2m
          labels:
            severity: critical
            service: mlflow
          annotations:
            summary: MLflow FSX health probe cannot schedule on every control-plane node
            description: Check the pending probe Pod events for CPU, memory, Pod IP, taint, and node-affinity capacity problems. FSX health is unknown on nodes without a scheduled probe.
        - alert: MLflowFSXDNSUnavailable
          expr: sum((kube_pod_status_ready{namespace="mlflow-system",pod=~"mlflow-fsx-dns-probe-.*",condition="true"} == 0) and on(namespace,pod) (kube_pod_status_scheduled{namespace="mlflow-system",pod=~"mlflow-fsx-dns-probe-.*",condition="true"} == 1)) > 0
          for: 2m
          labels:
            severity: critical
            service: mlflow
          annotations:
            summary: A control-plane node cannot resolve an FSX TOS endpoint through both configured IDC resolvers
            description: The effective node resolver chain cannot resolve both required TOS endpoints. The probe also logs per-resolver degradation for the two IDC and two VKE DNS servers. Restore DNS before recycling FSX mounts.
        - alert: MLflowFSXDNSProbeUnschedulable
          expr: max(kube_pod_status_unschedulable{namespace="mlflow-system",pod=~"mlflow-fsx-dns-probe-.*"}) > 0
          for: 2m
          labels:
            severity: critical
            service: mlflow
          annotations:
            summary: MLflow FSX DNS probe cannot schedule on every control-plane node
            description: Check the pending DNS probe Pod events. FSX endpoint DNS health is unknown on nodes without a scheduled probe.
        - alert: MLflowFSXProbeMissing
          expr: absent(kube_daemonset_status_desired_number_scheduled{namespace="mlflow-system",daemonset="mlflow-fsx-probe"})
          for: 5m
          labels:
            severity: warning
            service: mlflow
          annotations:
            summary: MLflow FSX health probe is missing from Prometheus
            description: The mlflow-fsx-probe DaemonSet or kube-state-metrics series is absent.
        - alert: MLflowFSXProbeHasNoTargets
          expr: kube_daemonset_status_desired_number_scheduled{namespace="mlflow-system",daemonset="mlflow-fsx-probe"} == 0
          for: 2m
          labels:
            severity: critical
            service: mlflow
          annotations:
            summary: MLflow FSX health probe has no target nodes
            description: No node matches the probe selector. Restore the platform.wellspiking.ai/pool=control-plane node labels before relying on FSX health status.
