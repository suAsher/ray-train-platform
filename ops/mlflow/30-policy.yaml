apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-ingest-nginx
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-ingest
    app.kubernetes.io/part-of: ray-train-platform
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      client_max_body_size 10m;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # Training code receives a write-only tracking surface. It cannot search
      # runs, fetch other users' params, or download MLflow artifacts.
      location = /api/2.0/mlflow/experiments/get-by-name {
        limit_except GET { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/experiments/create {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/create {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/update {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      # The MLflow Python client reads back only the high-entropy run ID it
      # just created while closing a run. There is still no search/list route.
      location = /api/2.0/mlflow/runs/get {
        limit_except GET { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/log-batch {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/log-metric {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/log-parameter {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/set-tag {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }
      location = /api/2.0/mlflow/runs/delete-tag {
        limit_except POST { deny all; }
        proxy_set_header Host mlflow:5000;
        proxy_pass http://mlflow.mlflow-system.svc.cluster.local:5000;
      }

      location /api/2.0/mlflow-artifacts/ { return 403; }
      location / { return 403; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-ingest
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-ingest
    app.kubernetes.io/part-of: ray-train-platform
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-ingest
  template:
    metadata:
      annotations:
        platform.wellspiking.ai/config-revision: "20260822-r2"
      labels:
        app.kubernetes.io/name: mlflow-ingest
        app.kubernetes.io/part-of: ray-train-platform
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        platform.wellspiking.ai/pool: control-plane
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: mlflow-ingest
              topologyKey: kubernetes.io/hostname
      containers:
        - name: nginx
          image: harbor.wellspiking.ai/hub/nginxinc/nginx-unprivileged@sha256:c3fed6436b61d2bf2201ec032c35c000871f7ed062dea5d586bc6bf4d0fdd140
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: mlflow-ingest-nginx
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow-ingest
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-ingest
    app.kubernetes.io/part-of: ray-train-platform
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mlflow-ingest
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ray-train-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: mlflow
  policyTypes: [Ingress, Egress]
  ingress:
    # The platform API reads job-scoped metrics for the browser.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ray-train-platform
          podSelector:
            matchLabels:
              app: ray-train-backend
      ports:
        - protocol: TCP
          port: 5000
    # Tenant workloads never reach the full-access MLflow server directly;
    # only the write-only gateway may forward accepted calls.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow-ingest
      ports:
        - protocol: TCP
          port: 5000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 5000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-ingest
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-ingest
    app.kubernetes.io/part-of: ray-train-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-ingest
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/managed-by: ray-train-platform
            matchExpressions:
              - key: ray.io/tenant-id
                operator: Exists
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
              app.kubernetes.io/instance: mlflow
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-postgres
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow-postgres
    app.kubernetes.io/part-of: ray-train-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mlflow-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mlflow
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-migration
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mlflow
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ray-train-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: mlflow
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mlflow
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: ray-train-platform
spec:
  namespaceSelector:
    matchNames: [mlflow-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow
      app.kubernetes.io/instance: mlflow
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
