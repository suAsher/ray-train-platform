apiVersion: batch/v1
kind: Job
metadata:
  name: mlflow-artifact-storage-probe
  namespace: mlflow-system
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/component: storage-bootstrap
    app.kubernetes.io/part-of: ray-train-platform
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow
        app.kubernetes.io/component: storage-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets:
        - name: harbor-registry
      nodeSelector:
        platform.wellspiking.ai/pool: control-plane
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: harbor.wellspiking.ai/guofeng.su/mlflow:v3.14.0-full@sha256:03c206d175084ee3f654a1353ab62ccd2e59048c54f9488f08cc4d8f5de0037d
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              probe=/mlflow-artifacts/.mlflow-write-delete-probe
              trap 'rm -f "$probe"' EXIT
              printf '%s\n' "$HOSTNAME" > "$probe"
              test -s "$probe"
              rm -f "$probe"
              test ! -e "$probe"
              trap - EXIT
              printf '%s\n' 'MLflow artifact storage write/delete probe passed'
          volumeMounts:
            - name: mlflow-artifacts
              mountPath: /mlflow-artifacts
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: mlflow-artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts-irsa
