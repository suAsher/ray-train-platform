apiVersion: v1
kind: PersistentVolume
metadata:
  name: ray-train-local-outputs-pv
  labels:
    app.kubernetes.io/part-of: ray-train-platform
    ray-train.platform/storage-kind: output
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - no_writeback_cache
    - tos_allow_delete=true
    # The approved Ray training image runs as uid/gid 1000.  Keep the output
    # prefix writable only to that workload identity instead of opening it to
    # every user in a multi-container pod.
    - uid=1000
    - gid=1000
    - dir_mode=770
    - file_mode=660
  csi:
    driver: fsx.csi.volcengine.com
    volumeHandle: ray-train-local-outputs-pv
    volumeAttributes:
      type: TOS
      server: tos-cn-shanghai.ivolces.com
      region: cn-shanghai
      bucket: shanghai-data-transfer
      path: /ray-train/tenants/local/outputs
      # CSI-FSX expects AccessKeyId / SecretAccessKey keys. This is kept
      # separate from the platform API's lower-case credential Secret.
      secretName: tos-fsx-credentials
      secretNamespace: ray-train-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tos-local-outputs
  namespace: tenant-local
  labels:
    app.kubernetes.io/part-of: ray-train-platform
    ray-train.platform/storage-kind: output
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: ray-train-local-outputs-pv
  resources:
    requests:
      storage: 500Gi
