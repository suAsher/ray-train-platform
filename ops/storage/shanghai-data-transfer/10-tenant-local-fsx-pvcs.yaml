# The three claims intentionally mount independent, narrow TOS roots instead
# of the bucket root. Training workloads cannot enumerate platform logs or
# unrelated tenant data through these mounts.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ray-train-local-datasets-pv
  labels:
    app.kubernetes.io/part-of: ray-train-platform
    ray-train.platform/storage-kind: dataset
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  mountOptions:
    - no_writeback_cache
  csi:
    driver: fsx.csi.volcengine.com
    volumeHandle: ray-train-local-datasets-pv
    volumeAttributes:
      type: TOS
      server: tos-cn-shanghai.ivolces.com
      region: cn-shanghai
      bucket: shanghai-data-transfer
      path: /ray-train/tenants/local/datasets
      # CSI-FSX expects AccessKeyId / SecretAccessKey keys. This is kept
      # separate from the platform API's lower-case credential Secret.
      secretName: tos-fsx-credentials
      secretNamespace: ray-train-platform
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tos-local-datasets
  namespace: tenant-local
  labels:
    app.kubernetes.io/part-of: ray-train-platform
    ray-train.platform/storage-kind: dataset
spec:
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: ray-train-local-datasets-pv
  resources:
    requests:
      storage: 500Gi
---
