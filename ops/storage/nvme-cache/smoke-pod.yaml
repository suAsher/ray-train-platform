apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: __PVC_NAME__
  namespace: ray-cache-local
  labels:
    app.kubernetes.io/part-of: ray-cache-smoke
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ray-cache-local
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: __POD_NAME__
  namespace: ray-cache-local
  labels:
    app.kubernetes.io/part-of: ray-cache-smoke
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    kubernetes.io/hostname: __NODE_NAME__
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: smoke
      image: harbor.wellspiking.ai/guofeng.su/busybox@sha256:ff6bba6f18535e7ccb3c1bbed0b84e5c733d7d9dd8815f1ea93ee73073135aa4
      imagePullPolicy: IfNotPresent
      command:
        - /bin/sh
        - -ceu
        - printf 'ray-cache-smoke\n' > /mnt/cache/marker && test -s /mnt/cache/marker && sleep 3600
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        privileged: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      volumeMounts:
        - name: cache
          mountPath: /mnt/cache
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: __PVC_NAME__
