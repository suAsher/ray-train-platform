<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ray AI Studio - 分布式 AI 训练控制台</title>
    <script src="/runtime-config.js"></script>
    <!-- The portal is served over a private network where fonts.googleapis.com
         does not resolve. A blocking stylesheet link there stalls first paint
         until the request times out, so the webfonts are loaded
         opportunistically and the local font stack in index.css renders
         immediately. -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    >
  </head>
  <body class="bg-[#0A0D14] text-slate-100 font-sans antialiased selection:bg-blue-600 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
