# Only send the Connection: upgrade header when the client actually asked for
# an upgrade; otherwise keep the connection alive.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://ray-train-backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # JupyterLab and code-server are reverse proxied through /api and need
        # the WebSocket upgrade to pass through.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Ray Jobs API compatibility gateway. Without this the SPA fallback answers
    # `ray job submit --address .../ray` with HTML and the CLI cannot work.
    location /ray/ {
        proxy_pass http://ray-train-backend:8080/ray/;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        # Working directory uploads can be large.
        client_max_body_size 2048m;
    }
}
