server {
    listen 8080;
    server_name _;
    autoindex off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # The client was renamed from rayctl to spk-rayjob. Already-published
    # install instructions and bookmarks keep resolving so an existing user is
    # not left with a 404 mid-upgrade. The old per-platform file names are
    # mapped onto the new ones rather than duplicating the binaries.
    location ~ ^/downloads/rayctl/rayctl-(?<platform>.+)$ {
        root /usr/share/nginx/html;
        try_files /downloads/spk-rayjob/spk-rayjob-$platform =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }

    location = /downloads/rayctl/SHA256SUMS {
        root /usr/share/nginx/html;
        try_files /downloads/spk-rayjob/SHA256SUMS =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
    }
}
