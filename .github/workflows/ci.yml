name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: raytrain
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: raytrain_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U raytrain -d raytrain_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install CLI shell test dependency
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Formatting gate
        id: formatting
        working-directory: backend
        run: |
          gofmt -d . > /tmp/gofmt.patch
          test ! -s /tmp/gofmt.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gofmt-patch
          path: /tmp/gofmt.patch
          if-no-files-found: error
      - name: Go vet
        if: ${{ !cancelled() }}
        working-directory: backend
        run: go vet ./...
      - name: Go and PostgreSQL regression
        if: ${{ !cancelled() }}
        working-directory: backend
        env:
          POSTGRES_TEST_DSN: postgres://raytrain:ci-only-password@localhost:5432/raytrain_test?sslmode=disable
        # Packages use the same throwaway database and test global migration locks.
        run: go test -p 1 -timeout=25m ./...
  runtime-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Environment runtime profiles
        run: python -m unittest discover -s images/environment-workspace -p 'test_*.py' -v
      - name: Environment builder boundaries
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s images/environment-builder -p 'test_*.py' -v
      - name: Runtime image profiles
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s images/raytrain-base -p 'test_*.py' -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell syntax test dependency
        run: sudo apt-get update && sudo apt-get install -y zsh
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install UI dependencies
        working-directory: frontend
        run: npm ci
      - name: UI tests
        working-directory: frontend
        run: npm test
      - name: UI build
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run build
  helm-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Portable chart contract
        run: bash scripts/test-delivery-render.sh
      - name: Public runtime image contract
        if: ${{ !cancelled() }}
        run: bash scripts/test-ray-runtime-images.sh --contract-only
      - name: Optional chart contracts
        if: ${{ !cancelled() }}
        run: |
          bash helm/ray-node-onboarding/tests/render-contract.sh
          bash helm/ray-cache-local/tests/render-contract.sh
          bash helm/ray-cache-local/tests/dual-render-contract.sh
          bash helm/ray-cache-local/tests/monitor-contract.sh
          helm lint helm/ray-observability
  source-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build public source materializer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/source-materializer/Dockerfile
          push: false
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build unified platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: local/raytrain:ci
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          kubectl_version: v1.32.2
          node_image: kindest/node:v1.32.2
          cluster_name: raytrain-ci
          wait: 120s
          ignore_failed_clean: true
      - name: Fresh cluster control-plane smoke
        run: bash scripts/ci-kind-smoke.sh
      - name: Remove disposable cluster
        if: always()
        run: kind delete cluster --name raytrain-ci
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [backend, frontend, helm-runtime, image, source-helper, runtime-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase image namespace
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
