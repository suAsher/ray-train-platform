name: Validate, Build and Publish Ray Training Platform

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: cr-cn-beijing.volces.com
  IMAGE_NAMESPACE: ray-platform

jobs:
  validate:
    name: Validate source and delivery contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test Go backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Test and build Portal
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm delivery profiles
        run: bash scripts/test-delivery-render.sh

      - name: Validate safe reset preview
        run: |
          bash -n ops/platform/lib/common.sh ops/platform/*.sh
          bash ops/platform/test/reset-preview-test.sh

  build-images:
    name: Build and publish platform images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.VOLC_CR_USERNAME }}
          password: ${{ secrets.VOLC_CR_PASSWORD }}

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ray-train-backend:${{ github.sha }}

      - name: Build Portal
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/ray-train-frontend:${{ github.sha }}
