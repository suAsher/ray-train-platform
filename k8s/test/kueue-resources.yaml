apiVersion: kueue.x-k8s.io/v1beta2
kind: ResourceFlavor
metadata:
  name: gpu-4090-flavor
  labels:
    ray-train-platform/test: "true"
spec:
  nodeLabels:
    accelerator: nvidia-rtx-4090
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: cluster-gpu-queue
  labels:
    ray-train-platform/test: "true"
spec:
  namespaceSelector:
    matchLabels:
      ray-train-platform/test: "true"
  resourceGroups:
    - coveredResources: ["cpu", "memory", "nvidia.com/gpu"]
      flavors:
        - name: gpu-4090-flavor
          resources:
            - name: "cpu"
              nominalQuota: 16
            - name: "memory"
              nominalQuota: 64Gi
            - name: "nvidia.com/gpu"
              nominalQuota: 1
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata:
  name: local-gpu-queue
  namespace: tenant-local
  labels:
    ray-train-platform/test: "true"
spec:
  clusterQueue: cluster-gpu-queue
