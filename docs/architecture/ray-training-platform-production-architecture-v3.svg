  <rect x="34" y="934" width="1852" height="116" rx="16" fill="#f7faff" stroke="#87b4ef" stroke-width="1.6"/>
  <rect x="52" y="950" width="170" height="38" rx="10" fill="#1460ce"/>
  <circle cx="75" cy="969" r="12" fill="#fff"/><text x="75" y="974" text-anchor="middle" font-size="14" font-weight="800" fill="#1460ce">7</text>
  <text x="93" y="976" font-size="18" font-weight="800" class="white">训练闭环</text>
  <g><rect x="270" y="955" width="190" height="68" rx="34" fill="#fff" stroke="#6fa5ea"/><text x="365" y="995" class="flowText" text-anchor="middle">选择代码 / 镜像 / 数据</text></g>
  <g><rect x="510" y="955" width="160" height="68" rx="34" fill="#fff" stroke="#9c83e1"/><text x="590" y="995" class="flowText" text-anchor="middle">GPU 调试</text></g>
  <g><rect x="720" y="955" width="160" height="68" rx="34" fill="#fff" stroke="#6fa5ea"/><text x="800" y="995" class="flowText" text-anchor="middle">提交任务</text></g>
  <g><rect x="930" y="955" width="160" height="68" rx="34" fill="#fff" stroke="#64b987"/><text x="1010" y="995" class="flowText" text-anchor="middle">排队 / 训练</text></g>
  <g><rect x="1140" y="955" width="180" height="68" rx="34" fill="#fff" stroke="#df8b45"/><text x="1230" y="995" class="flowText" text-anchor="middle">日志 / 指标 / Loss</text></g>
  <g><rect x="1370" y="955" width="160" height="68" rx="34" fill="#fff" stroke="#9c83e1"/><text x="1450" y="995" class="flowText" text-anchor="middle">调参与续跑</text></g>
  <g><rect x="1580" y="955" width="190" height="68" rx="34" fill="#fff" stroke="#64b987"/><text x="1675" y="995" class="flowText" text-anchor="middle">Checkpoint / 产物</text></g>

