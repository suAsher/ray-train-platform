namespace: ray-train-platform

release:
  # Test profiles may use a release tag. Production profiles require digests
  # so a Helm revision always identifies exact Portal and API images.
  requireImageDigests: false

global:
  imagePullPolicy: IfNotPresent
  imageRegistry: cr-cn-beijing.volces.com/ray-platform
  imagePullSecrets: []

# Portable placement policy for platform-owned workloads. A cluster profile
# may prefer a dedicated CPU pool while still allowing physical GPU nodes to
# absorb control-plane Pods when CPU capacity is exhausted.
placement:
  preferredNodeSelector: {}
  allowGPUNodeFallback: false

# Submission feature gates are disabled by default. They affect only new
# submissions; persisted jobs retain their immutable runtime snapshot.
# Runtime references are populated with immutable digests only after
# post-build smoke testing.
rayTrain:
  managedEnabled: false
  managedTenants: []
  canaryEnabled: false
  canaryTenants: []
  productionVersion: "2.56.1"
  canaryVersion: "2.58.0"
  runtimeCatalog:
    legacyDDP:
      reference: "REPLACE_WITH_RAY_235_DDP_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
      rayVersion: "2.35.0"
      supportedEngines: ["ray-ddp"]
    productionDDP:
      reference: "REPLACE_WITH_RAY_256_DDP_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
      rayVersion: "2.56.1"
      supportedEngines: ["ray-ddp"]
    productionManaged:
      reference: "REPLACE_WITH_RAY_256_MANAGED_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
      rayVersion: "2.56.1"
      supportedEngines: ["ray-train"]
    productionWorkspace:
      reference: "REPLACE_WITH_RAY_256_WORKSPACE_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
      rayVersion: "2.56.1"
    canaryManagedBEVFusion:
      reference: "REPLACE_WITH_RAY_258_BEVFUSION_IMAGE@sha256:REPLACE_WITH_64_HEX_DIGEST"
      rayVersion: "2.58.0"
      supportedEngines: ["ray-train"]

backend:
  replicaCount: 2
  # Optional scheduling boundary for control-plane Pods. Production profiles
  # use the dedicated CPU node pool; the default remains portable.
  nodeSelector: {}
  appEnv: production
  oidcRequired: true
  demoMode: false
  # Feature gates for versioned Ray Data training. They stay off until the
  # supporting API and domain components are ready. Dataset publisher rollout
  # is governed independently under datasetPublisher.
  datasetVersioningEnabled: false
  rayDataStreamingEnabled: false
  datasetInternalPrefix: ray-train/platform/datasets
  # Disabled: user workloads use Git or immutable workspace snapshots, so no
  # object-store credential is ever injected into a Ray Pod.
  sourceArtifactsEnabled: false
  # The standard `ray job submit --working-dir .` entry point has no image
  # flag. It uses this administrator-pinned 1xGPU runtime by default.
  rayAPIDefaultImage: ""
  image:
    repository: ray-train-backend
    tag: "REPLACE_WITH_IMMUTABLE_TAG"
    digest: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi
  database:
    existingSecret: ray-platform-postgres
    secretKey: DATABASE_URL
  oidc:
    issuerURL: "https://keycloak.idc.example/realms/ai"
    clientID: ray-training-platform
    audience: ray-training-platform-api
    groupPrefix: platform/tenants/
  # Secret holding PAT_PEPPER, the HMAC key for personal access tokens and
  # local session tokens. Must contain at least 32 bytes.
  pat:
    existingSecret: ray-platform-pat
  # Built-in username/password accounts. These work with or without Keycloak,
  # so the platform is usable and testable without an external IdP.
  localAuth:
    enabled: true
    sessionHours: 12
    bootstrapUsername: admin
    bootstrapTenant: local
    # Secret holding BOOTSTRAP_ADMIN_PASSWORD, used only to create the very
    # first administrator. Leave empty to skip bootstrapping.
    bootstrapSecret: ray-platform-bootstrap-admin
  # Stable in-cluster Loki gateway. The backend appends /loki/api/v1 paths.
  lokiURL: "http://loki-gateway.loki.svc.cluster.local"
  prometheusURL: "http://prometheus.monitoring.svc.cluster.local:9090"
  mlflow:
    # Opt-in: a control-plane upgrade must not change Ray workloads before the
    # internal MLflow service has passed its own readiness checks.
    enabled: false
    dashboardEnabled: false
    publicOrigin: ""
    dashboardSessionHours: 8
    trackingURL: "http://mlflow.mlflow-system.svc.cluster.local:5000/mlflow"
    ingestURL: "http://mlflow-ingest.mlflow-system.svc.cluster.local:8080"
    experimentPrefix: raytrain
  corsOrigins: []
  imageAllowlist:
    - cr-cn-beijing.volces.com/ray-platform/ray-train
  gitAllowlist:
    - git.example.com
  workspaceImage: "REPLACE_WITH_IMMUTABLE_WORKSPACE_IMAGE"
  sourceMaterializerImage: "REPLACE_WITH_IMMUTABLE_SOURCE_MATERIALIZER_IMAGE"
  rayVersion: "2.35.0"
  rayJobClusterSpecField: rayClusterSpec
  # Training and debug Pods run in tenant namespaces. Leave empty unless a
  # tenant-local, least-privilege ServiceAccount is provisioned separately.
  rayJobServiceAccount: ""

# CPU-only batch settings for immutable dataset publication. This component has
# its own default-off rollout gate and does not inherit the training Kueue gate.
# The workload obtains cloud credentials through exactly one platform-owned
# source: VKE IRSA or an existing namespace-scoped TOS Secret. Helm never
# creates or copies that Secret, and tenant training/debug Pods never consume it.
datasetPublisher:
  enabled: false
  # Empty values inherit the platform TOS bucket/endpoint/region. Keep the
  # source and derived prefixes separate. Select exactly one credential source
  # below; production may reference an existing platform-managed Secret.
  sourceBucket: ""
  targetBucket: ""
  endpoint: ""
  region: ""
  sourceIndexName: .raytrain/trusted-index-v2.pkl
  serviceAccount:
    # Optional VKE IAM role TRN. Empty means no
    # vke.volcengine.com/role-trn annotation is rendered.
    irsaRoleTRN: ""
  # Optional existing Secret with access-key and secret-key. This is mutually
  # exclusive with serviceAccount.irsaRoleTRN and is never copied by Helm.
  credentials:
    existingSecret: ""
  image:
    repository: ray-dataset-publisher
    tag: "REPLACE_WITH_IMMUTABLE_TAG"
    digest: ""
  imagePullPolicy: ""
  kueue:
    # Empty names are generated from the Helm release. Explicit values override
    # the generated resource names.
    resourceFlavorName: ""
    clusterQueueName: ""
    localQueueName: ""
    cpuQuota: 16
    memoryQuota: 64Gi
    # Empty keeps the CPU-only flavor portable: publication Jobs can use spare
    # CPU and memory on physical GPU nodes after any soft CPU-pool preference.
    resourceFlavorNodeLabels: {}
  # Empty creates a release-scoped low-priority class name.
  priorityClassName: ""
  priorityValue: -1000
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
    limits:
      cpu: 4000m
      memory: 8Gi
  job:
    backoffLimit: 3
    activeDeadlineSeconds: 604800
    ttlSecondsAfterFinished: 86400
  kubernetesClient:
    maxAttempts: 3
    initialRetryBackoffSeconds: 1
    maximumRetryBackoffSeconds: 30
  manager:
    pollIntervalSeconds: 10
  # Disabled by default: existing releases retain the one-Job publisher until
  # the distributed plan/pack/finalize controller is explicitly enabled.
  distributed:
    enabled: false
    partitionCount: 256
    maxParallelism: 4
    partitionLeaseSeconds: 900
    maxPartitionAttempts: 3
  workingDirectory: /data/output
  # The controller translates preferredNodeSelector into soft node affinity,
  # so a cluster profile can prefer CPU nodes while retaining GPU-node CPU and
  # memory fallback. nodeSelector remains an explicit hard-selection override.
  preferredNodeSelector: {}
  nodeSelector: {}
  tolerations: []

frontend:
  replicaCount: 2
  # Optional scheduling boundary for Portal Pods.
  nodeSelector: {}
  image:
    repository: ray-train-frontend
    tag: "REPLACE_WITH_IMMUTABLE_TAG"
    digest: ""
  service:
    type: ClusterIP
    port: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

  runtimeConfig:
    authRequired: true
    keycloakURL: "https://keycloak.idc.example"
    keycloakRealm: ai
    keycloakClientID: ray-training-platform

spkRayjobRelease:
  enabled: false
  replicaCount: 2
  nodeSelector: {}
  image:
    repository: spk-rayjob-release
    tag: "REPLACE_WITH_IMMUTABLE_TAG"
    digest: ""
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 250m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

ingress:
  enabled: true
  className: alb
  host: ai-training.internal.example
  annotations:
    ingress.vke.volcengine.com/loadbalancer-type: private
    # Pod pass-through lets the VKE ALB target ClusterIP Service endpoints;
    # without it, the controller requires NodePort or LoadBalancer Services.
    ingress.vke.volcengine.com/loadbalancer-pass-through: "true"
    ingress.vke.volcengine.com/loadbalancer-port: "80"
    ingress.vke.volcengine.com/request-timeout: "3600"
    ingress.vke.volcengine.com/keepalive-timeout: "3600"
  https:
    enabled: false
    host: ""
    className: ""
    # native-secret is VKE beta. Production uses alb-instance and binds the
    # Certificate Center ID on a dedicated private ALBInstance.
    certificateMode: native-secret
    tlsSecretName: ""
    annotations:
      ingress.vke.volcengine.com/loadbalancer-type: private
      # Keep this aligned with the HTTP ingress: platform Services remain
      # internal ClusterIP Services and are not exposed through NodePort.
      ingress.vke.volcengine.com/loadbalancer-pass-through: "true"
      ingress.vke.volcengine.com/loadbalancer-port: "443"
      ingress.vke.volcengine.com/loadbalancer-protocol: https
      ingress.vke.volcengine.com/request-timeout: "3600"
      ingress.vke.volcengine.com/keepalive-timeout: "3600"

# A dedicated private VKE ALB and its cluster-scoped IngressClass. It is
# intentionally disabled by default because subnet IDs and certificate IDs are
# environment-specific. blockCascadeDeletion protects the cloud ALB when a
# Helm release is removed.
albInstance:
  enabled: false
  name: ""
  className: ""
  instance:
    # Set only when adopting an existing private ALB. Otherwise the bootstrap
    # operation creates one from name/zoneMappings.
    instanceID: ""
    name: ""
    edition: Basic
    addressType: private
    ipVersion: ipv4
    deleteProtection: "on"
    zoneMappings: []
  https:
    host: ""
    certificateSource: cert_center
    certificateID: ""

# Where Ray head and worker Pods are allowed to run. Comma-separated
# key=value labels. Adding GPU machines only means labelling them the same way
# and raising the Kueue quota below — no image rebuild.
training:
  nodeSelector: "accelerator=nvidia-rtx-4090"
  # Largest single job the platform accepts. Defaults match a 3 × 8 fleet;
  # raise them when machines are added — values change only, no rebuild.
  maxWorkerReplicas: 3
  maxGPUsPerWorker: 8
  maxTotalGPUs: 24
  # Disposable per-Pod cache on a GPU node's local data disk. Keep disabled
  # until every GPU node has the same tested local CSI StorageClass. This is
  # not a data asset and must never hold final checkpoints or model outputs.
  localCache:
    # Infrastructure availability only. Individual tasks remain cache-off
    # unless their request explicitly selects a policy-supported cache mode.
    available: false
    storageClassData1: ""
    storageClassData2: ""
    mountPathData1: ""
    mountPathData2: ""
    policy:
      defaultMode: "off"
      allowedSizes:
        - 200Gi
        - 500Gi
        - 1Ti
        - 2Ti
        - 4Ti
        - 5Ti
      defaultSize: 200Gi
      maxSize: 5Ti

# Governed user data spaces. Keep disabled until csi-fsx is configured with
# its component-level IRSA role and ops/storage/.../41-verify-irsa-prefix-mount.sh
# reports success. This never injects TOS credentials into Ray Pods.
dataSpaces:
  enabled: false
  # Capacity is Kubernetes accounting for the RWX static PV, not a hard TOS
  # quota. The CSI component's IRSA role is the only credential used.
  mountCapacity: 1Ti
  fsxVolumeAttributes: {}
  # Standard public dataset root. A temporary value is accepted only as
  # ray-train/tenants/<tenant>/datasets/public during a controlled migration.
  publicRoot: ray-train/public

# Native TOS ObjectSet hard quotas for personal roots. This is independent of
# FSX mounting: it can be prepared before GPU nodes or CSI IRSA are ready, and
# never gives a workload Pod an AK/SK. The SuperAdmin initializes the bucket
# layout once from the Portal before accounts are provisioned with a quota.
personalStorage:
  objectSetQuota:
    enabled: false
    defaultQuota: 100Gi
    maxQuota: 10Ti

# Administrator-configured IDC NFS exports. This replaces the legacy single
# storage.existingClaim compatibility path. Each enabled tenant gets three
# retained ReadOnlyMany PVC adapters, mounted in workloads at /mnt/.*.
# Do not put user-specific mount paths or personal SSHFS credentials here.
idcDataSpaces:
  enabled: false
  mountCapacity: 1Pi
  sources:
    original:
      server: ""
      path: ""
      mountOptions: []
    wellspiking:
      server: ""
      path: ""
      mountOptions: []
    shared:
      server: ""
      path: ""
      mountOptions: []
    spk-hybrid:
      server: ""
      path: ""
      mountOptions: []
    spk-ssd:
      server: ""
      path: ""
      mountOptions: []

kueue:
  enabled: false
  # True means this Helm release owns the training ResourceFlavor and
  # ClusterQueue. False attaches training to a queue managed outside this
  # project. Dataset publisher queues are governed independently above.
  manageResources: false
  # Kueue's nominalQuota is a static field with no capacity discovery. With this
  # on, the controller keeps it equal to the allocatable capacity of the nodes
  # matching training.nodeSelector, so adding a machine only means labelling it.
  # Turn it off if an operator wants to hand out a deliberately smaller budget.
  autoQuota: true
  clusterQueueName: cluster-gpu-queue
  resourceFlavorName: gpu-4090-flavor
  gpuQuota: 24
  cpuQuota: 256
  memoryQuota: 1024Gi
  resourceFlavorNodeLabels:
    accelerator: nvidia-rtx-4090

storage:
  # Deprecated compatibility switch. Keep false: governed IDC data uses the
  # idcDataSpaces section above, never a single shared arbitrary PVC.
  enabled: false
  existingClaim: ""
  storageClass: ""
  size: 2Ti
  accessModes:
    - ReadWriteMany
  tenantNamespaces: []
  mountPath: /mnt/idc

networkPolicy:
  enabled: true

availability:
  pdbEnabled: true
  minAvailable: 1
  # Deployment defaults favor zero-downtime updates when the cluster has
  # spare capacity. Smaller HA pools can override these in their profile.
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
  preferredAntiAffinity: true
  # The CPU HA profile uses hard host separation. Keep the default relaxed so
  # a small development cluster can still run a single replica.
  requiredAntiAffinity: false
  topologySpreadWhenUnsatisfiable: ScheduleAnyway

autoscaling:
  backend:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# Prometheus Operator integration for managed Ray Train + Ray Data workers.
# The parent gate is deliberately off in the portable chart: clusters without
# monitoring.coreos.com CRDs must still install and upgrade successfully.
monitoring:
  enabled: false
  namespace: monitoring
  podMonitor:
    # Keep this off when the cluster already has the platform-wide
    # ops/observability/prometheus-operator/60-ray-pod-monitor.yaml. Enable it
    # only on portable installs that do not already scrape Ray workers.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
  prometheusRule:
    enabled: true
    publicationFailedFor: 2m
    publicationStalledFor: 15m
    publicationStalledSeconds: 21600
    sourceReadP95For: 10m
    sourceReadP95Seconds: 2
    cacheHitRatioFor: 15m
    cacheHitRatioMinimum: 0.5
    cacheMinimumRequests: 20
    cacheEvictionFor: 10m
    cacheEvictionsPer15m: 20
    prefetchWaitFor: 10m
    prefetchWaitRatio: 0.2
    objectSpillFor: 10m
    objectSpillBytesPerSecond: 104857600
    gpuDataStallFor: 10m
    gpuDataStallRatio: 0.2
    gpuDataStallUtilizationPercent: 70

tos:
  endpoint: "https://tos-cn-beijing.volces.com"
  region: "cn-beijing"
  bucket: ""
  secretName: "tos-credentials"

postgres:
  # standalone is a disposable test database only. Production uses `external`
  # and references a managed/HA PostgreSQL DATABASE_URL Secret.
  mode: external
  existingSecret: ray-platform-postgres
  standalone:
    image: docker.io/library/postgres:16-alpine
    databaseName: platform
    storageClass: ""
    size: 20Gi
    # Keep the disposable single-instance database off GPU/VCI nodes when a
    # control-plane node pool is available.
    nodeSelector: {}
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 2Gi
