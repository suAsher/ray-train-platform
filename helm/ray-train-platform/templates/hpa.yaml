{{- range $workload := list (dict "name" "ray-train-backend" "component" "api" "values" .Values.autoscaling.backend) (dict "name" "ray-train-frontend" "component" "portal" "values" .Values.autoscaling.frontend) }}
{{- $settings := $workload.values }}
{{- if $settings.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $workload.name }}
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "ray-train-platform.commonLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $workload.component }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $workload.name }}
  minReplicas: {{ $settings.minReplicas }}
  maxReplicas: {{ $settings.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $settings.targetCPUUtilizationPercentage }}
---
{{- end }}
{{- end }}
