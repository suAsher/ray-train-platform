{{- if and .Values.ingress.enabled (contains "example" .Values.ingress.host) }}{{- fail "ingress.host must be replaced with the internal platform hostname" }}{{- end }}
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ray-platform-intranet-alb-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ray-train-platform.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingress
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ray-train-frontend
                port:
                  number: 80
{{- end }}
