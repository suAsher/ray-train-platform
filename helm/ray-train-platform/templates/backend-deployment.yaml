{{- if contains "REPLACE_WITH" .Values.backend.image.tag }}{{- fail "backend.image.tag must be replaced with an immutable release tag or digest" }}{{- end }}
{{- if and .Values.release.requireImageDigests (not .Values.backend.image.digest) }}{{- fail "backend.image.digest is required when release.requireImageDigests is true" }}{{- end }}
{{- if and .Values.backend.image.digest (not (regexMatch `^sha256:[0-9a-fA-F]{64}$` .Values.backend.image.digest)) }}{{- fail "backend.image.digest must use sha256:<64 hex>" }}{{- end }}
{{- if and (eq .Values.backend.appEnv "production") (ne .Values.postgres.mode "external") }}{{- fail "production deployments must use postgres.mode=external" }}{{- end }}
{{- /* The OIDC issuer only has to be real when OIDC is actually required; a
local-account deployment never contacts Keycloak. */}}
{{- if .Values.backend.oidcRequired }}
{{- if contains "example" .Values.backend.oidc.issuerURL }}{{- fail "backend.oidc.issuerURL must point to the organization's Keycloak realm when oidcRequired is true" }}{{- end }}
{{- end }}
{{- if contains "REPLACE_WITH" .Values.backend.workspaceImage }}{{- fail "backend.workspaceImage must be replaced with a pinned workspace image" }}{{- end }}
{{- if contains "REPLACE_WITH" .Values.backend.sourceMaterializerImage }}{{- fail "backend.sourceMaterializerImage must be replaced with a pinned source materializer image" }}{{- end }}
{{- if not (regexMatch `^[^@[:space:]]+@sha256:[0-9a-fA-F]{64}$` .Values.backend.sourceMaterializerImage) }}{{- fail "backend.sourceMaterializerImage must use @sha256:<64 hex>" }}{{- end }}
{{- if not (regexMatch `^[^@[:space:]]+@sha256:[0-9a-fA-F]{64}$` .Values.backend.workspaceImage) }}{{- fail "backend.workspaceImage must use @sha256:<64 hex>" }}{{- end }}
{{- /* Existing releases may predate training.localCache. Keep --reuse-values
      upgrades safe by treating that absent map as the disabled default. */}}
{{- $localCache := default (dict) .Values.training.localCache }}
{{- $localCachePolicy := default (dict) (get $localCache "policy") }}
{{- $localCacheAvailable := default false (get $localCache "available") }}
{{- if $localCacheAvailable }}
{{- $storageClass := required "training.localCache.storageClass is required when local cache is available" (get $localCache "storageClass") }}
{{- $mountPath := required "training.localCache.mountPath is required when local cache is available" (get $localCache "mountPath") }}
{{- if or (not (hasPrefix "/" $mountPath)) (eq $mountPath "/") }}{{- fail "training.localCache.mountPath must be a non-root absolute path" }}{{- end }}
{{- if ne (default "" (get $localCachePolicy "defaultMode")) "off" }}{{- fail "training.localCache.policy.defaultMode must be off" }}{{- end }}
{{- if not (get $localCachePolicy "allowedSizes") }}{{- fail "training.localCache.policy.allowedSizes is required when local cache is available" }}{{- end }}
{{- $defaultSize := required "training.localCache.policy.defaultSize is required when local cache is available" (get $localCachePolicy "defaultSize") -}}
{{- $maxSize := required "training.localCache.policy.maxSize is required when local cache is available" (get $localCachePolicy "maxSize") -}}
{{- end }}
{{- $mlflow := default (dict) .Values.backend.mlflow }}
{{- $dataSpaces := default (dict) .Values.dataSpaces }}
{{- $personalStorage := default (dict) .Values.personalStorage }}
{{- $objectSetQuota := default (dict) $personalStorage.objectSetQuota }}
{{- $idcDataSpaces := default (dict) .Values.idcDataSpaces }}
{{- $legacyStorage := default (dict) .Values.storage }}
{{- if (default false $legacyStorage.enabled) }}{{- fail "storage.enabled is deprecated; configure governed idcDataSpaces instead" }}{{- end }}
{{- if (default false $dataSpaces.enabled) }}
{{- $dataSpaceAttributes := default (dict) $dataSpaces.fsxVolumeAttributes }}
{{- if not (kindIs "map" $dataSpaceAttributes) }}{{- fail "dataSpaces.fsxVolumeAttributes must be a YAML map when dataSpaces.enabled is true" }}{{- end }}
{{- if not (default "" $dataSpaces.mountCapacity) }}{{- fail "dataSpaces.mountCapacity is required when dataSpaces.enabled is true" }}{{- end }}
{{- range $required := list "type" "bucket" "server" "region" }}
{{- if not (default "" (get $dataSpaceAttributes $required)) }}{{- fail (printf "dataSpaces.fsxVolumeAttributes.%s is required when dataSpaces.enabled is true" $required) }}{{- end }}
{{- end }}
{{- if ne (upper (toString (get $dataSpaceAttributes "type"))) "TOS" }}{{- fail "dataSpaces.fsxVolumeAttributes.type must be TOS" }}{{- end }}
{{- range $forbidden := list "path" "secretName" "secretNamespace" }}
{{- if hasKey $dataSpaceAttributes $forbidden }}{{- fail (printf "dataSpaces.fsxVolumeAttributes must not contain %s; workload mounts use csi-fsx component IRSA" $forbidden) }}{{- end }}
{{- end }}
{{- end }}
{{- if (default false $idcDataSpaces.enabled) }}
{{- if not (default "" $idcDataSpaces.mountCapacity) }}{{- fail "idcDataSpaces.mountCapacity is required when idcDataSpaces.enabled is true" }}{{- end }}
{{- $idcSources := default (dict) $idcDataSpaces.sources }}
{{- if not (kindIs "map" $idcSources) }}{{- fail "idcDataSpaces.sources must be a YAML map when idcDataSpaces.enabled is true" }}{{- end }}
{{- range $name := list "original" "wellspiking" "shared" }}
{{- $source := get $idcSources $name }}
{{- if not (kindIs "map" $source) }}{{- fail (printf "idcDataSpaces.sources.%s must be a YAML map when idcDataSpaces.enabled is true" $name) }}{{- end }}
{{- $server := default "" (get $source "server") }}
{{- $path := default "" (get $source "path") }}
{{- if not $server }}{{- fail (printf "idcDataSpaces.sources.%s.server is required when idcDataSpaces.enabled is true" $name) }}{{- end }}
{{- if or (not $path) (eq $path "/") (not (hasPrefix "/" $path)) }}{{- fail (printf "idcDataSpaces.sources.%s.path must be a non-root absolute export path" $name) }}{{- end }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ray-train-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ray-train-platform.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
    app: ray-train-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.availability.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.availability.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      app: ray-train-backend
  template:
    metadata:
      labels:
        {{- include "ray-train-platform.commonLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
        app: ray-train-backend
    spec:
      serviceAccountName: ray-train-platform-sa
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.availability.topologySpreadWhenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app: ray-train-backend
      affinity:
        {{- include "ray-train-platform.nodeAffinity" . | nindent 8 }}
        {{- if .Values.availability.requiredAntiAffinity }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: ray-train-backend
              topologyKey: kubernetes.io/hostname
        {{- else if .Values.availability.preferredAntiAffinity }}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: ray-train-backend
        {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: {{ include "ray-train-platform.image" (list . .Values.backend.image) | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: APP_ENV
              value: {{ .Values.backend.appEnv | quote }}
            - name: HTTP_ADDR
              value: ":8080"
            - name: PLATFORM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.database.existingSecret is required" .Values.backend.database.existingSecret }}
                  key: {{ .Values.backend.database.secretKey }}
            - name: OIDC_ISSUER_URL
              value: {{ required "backend.oidc.issuerURL is required" .Values.backend.oidc.issuerURL | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ required "backend.oidc.clientID is required" .Values.backend.oidc.clientID | quote }}
            - name: OIDC_AUDIENCE
              value: {{ required "backend.oidc.audience is required" .Values.backend.oidc.audience | quote }}
            - name: OIDC_GROUP_PREFIX
              value: {{ .Values.backend.oidc.groupPrefix | quote }}
            - name: OIDC_REQUIRED
              value: {{ .Values.backend.oidcRequired | quote }}
            - name: DEMO_MODE
              value: {{ .Values.backend.demoMode | quote }}
            - name: PAT_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ required "backend.pat.existingSecret is required" .Values.backend.pat.existingSecret }}
                  key: PAT_PEPPER
            - name: TRAINING_NODE_SELECTOR
              value: {{ .Values.training.nodeSelector | quote }}
            - name: MAX_WORKER_REPLICAS
              value: {{ .Values.training.maxWorkerReplicas | quote }}
            - name: MAX_GPUS_PER_WORKER
              value: {{ .Values.training.maxGPUsPerWorker | quote }}
            - name: MAX_TOTAL_GPUS
              value: {{ .Values.training.maxTotalGPUs | quote }}
            - name: LOCAL_CACHE_ENABLED
              value: {{ default false (get $localCache "available") | quote }}
            - name: LOCAL_CACHE_STORAGE_CLASS
              value: {{ default "" (get $localCache "storageClass") | quote }}
            - name: LOCAL_CACHE_SIZE
              value: {{ default "" (get $localCachePolicy "defaultSize") | quote }}
            - name: LOCAL_CACHE_MOUNT_PATH
              value: {{ default "" (get $localCache "mountPath") | quote }}
            - name: LOCAL_CACHE_ALLOWED_SIZES
              value: {{ join "," (default (list) (get $localCachePolicy "allowedSizes")) | quote }}
            - name: LOCAL_CACHE_MAX_SIZE
              value: {{ default "" (get $localCachePolicy "maxSize") | quote }}
            # New governed TOS mounts remain opt-in until the csi-fsx IRSA
            # prefix-isolation smoke test has passed. Browsing stays available,
            # but Ray workloads are not changed by a compatibility upgrade.
            - name: DATA_SPACES_ENABLED
              value: {{ default false $dataSpaces.enabled | quote }}
            - name: DATA_SPACES_MOUNT_CAPACITY
              value: {{ default "" $dataSpaces.mountCapacity | quote }}
            - name: DATA_SPACES_FSX_VOLUME_ATTRIBUTES_JSON
              value: {{ toJson (default (dict) $dataSpaces.fsxVolumeAttributes) | quote }}
            - name: DATA_SPACES_PUBLIC_ROOT
              value: {{ default "ray-train/public" $dataSpaces.publicRoot | quote }}
            # Native TOS hard quota for each platform user's fixed ObjectSet.
            # It is independent of dataSpaces.enabled (FSX mounts), so admins
            # can prepare and govern personal storage before GPU rollout.
            - name: TOS_OBJECT_SET_QUOTAS_ENABLED
              value: {{ default false $objectSetQuota.enabled | quote }}
            - name: PERSONAL_STORAGE_DEFAULT_QUOTA
              value: {{ default "100Gi" $objectSetQuota.defaultQuota | quote }}
            - name: PERSONAL_STORAGE_MAX_QUOTA
              value: {{ default "10Ti" $objectSetQuota.maxQuota | quote }}
            # IDC NFS exports are configured by the platform operator. The
            # API creates only tenant-local read-only adapters; users never
            # submit an arbitrary server/path and cannot browse the export
            # through the web object browser.
            - name: IDC_DATA_SPACES_ENABLED
              value: {{ default false $idcDataSpaces.enabled | quote }}
            - name: IDC_DATA_SPACES_MOUNT_CAPACITY
              value: {{ default "" $idcDataSpaces.mountCapacity | quote }}
            - name: IDC_DATA_SPACES_SOURCES_JSON
              value: {{ toJson (default (dict) $idcDataSpaces.sources) | quote }}
            - name: KUEUE_AUTO_QUOTA
              value: {{ .Values.kueue.autoQuota | quote }}
            - name: LOCAL_AUTH_ENABLED
              value: {{ .Values.backend.localAuth.enabled | quote }}
            - name: LOCAL_SESSION_HOURS
              value: {{ .Values.backend.localAuth.sessionHours | quote }}
            - name: BOOTSTRAP_ADMIN_USERNAME
              value: {{ .Values.backend.localAuth.bootstrapUsername | quote }}
            - name: BOOTSTRAP_ADMIN_TENANT
              value: {{ .Values.backend.localAuth.bootstrapTenant | quote }}
            {{- if .Values.backend.localAuth.bootstrapSecret }}
            # Only used the first time the local_users table is empty; later
            # restarts never overwrite an existing account.
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.localAuth.bootstrapSecret }}
                  key: BOOTSTRAP_ADMIN_PASSWORD
            {{- end }}
            - name: LOKI_URL
              value: {{ .Values.backend.lokiURL | quote }}
            - name: PROMETHEUS_URL
              value: {{ .Values.backend.prometheusURL | quote }}
            - name: MLFLOW_ENABLED
              value: {{ default false $mlflow.enabled | quote }}
            - name: MLFLOW_DASHBOARD_ENABLED
              value: {{ default false $mlflow.dashboardEnabled | quote }}
            - name: MLFLOW_PUBLIC_ORIGIN
              value: {{ default "" $mlflow.publicOrigin | quote }}
            - name: MLFLOW_DASHBOARD_SESSION_HOURS
              value: {{ default 8 $mlflow.dashboardSessionHours | quote }}
            - name: MLFLOW_TRACKING_URL
              value: {{ default "" $mlflow.trackingURL | quote }}
            - name: MLFLOW_INGEST_URL
              value: {{ default "" $mlflow.ingestURL | quote }}
            - name: MLFLOW_EXPERIMENT_PREFIX
              value: {{ default "raytrain" $mlflow.experimentPrefix | quote }}
            - name: KUEUE_CLUSTER_QUEUE
              value: {{ .Values.kueue.clusterQueueName | quote }}
            - name: CORS_ORIGINS
              value: {{ join "," .Values.backend.corsOrigins | quote }}
            - name: RAY_VERSION
              value: {{ .Values.backend.rayVersion | quote }}
            - name: KUBERAY_RAYJOB_CLUSTER_SPEC_FIELD
              value: {{ .Values.backend.rayJobClusterSpecField | quote }}
            - name: RAY_JOB_SERVICE_ACCOUNT
              value: {{ .Values.backend.rayJobServiceAccount | quote }}
            - name: IMAGE_PULL_SECRETS
              value: {{ include "ray-train-platform.imagePullSecretNames" . | quote }}
            - name: RAY_IMAGE_ALLOWLIST
              value: {{ join "," .Values.backend.imageAllowlist | quote }}
            - name: GIT_ALLOWLIST
              value: {{ join "," .Values.backend.gitAllowlist | quote }}
            - name: WORKSPACE_IMAGE
              value: {{ required "backend.workspaceImage is required" .Values.backend.workspaceImage | quote }}
            - name: SOURCE_MATERIALIZER_IMAGE
              value: {{ required "backend.sourceMaterializerImage is required" .Values.backend.sourceMaterializerImage | quote }}
            - name: SOURCE_ARTIFACTS_ENABLED
              value: {{ .Values.backend.sourceArtifactsEnabled | quote }}
            - name: RAY_API_DEFAULT_IMAGE
              value: {{ .Values.backend.rayAPIDefaultImage | quote }}
            - name: TOS_ENDPOINT
              value: {{ .Values.tos.endpoint | quote }}
            - name: TOS_BUCKET
              value: {{ .Values.tos.bucket | quote }}
            - name: TOS_SECRET_NAME
              value: {{ .Values.tos.secretName | quote }}
            {{- if .Values.tos.secretName }}
            - name: TOS_REGION
              # Region is deployment configuration, not credential material.
              # Keeping it in values means AK/SK rotation cannot make the
              # backend unschedulable because of an unrelated Secret key.
              value: {{ .Values.tos.region | quote }}
            - name: TOS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tos.secretName | quote }}
                  key: access-key
            - name: TOS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tos.secretName | quote }}
                  key: secret-key
            - name: TOS_SECURITY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tos.secretName | quote }}
                  key: security-token
                  optional: true
            {{- end }}
            - name: RAY_API_SPOOL_SIZE_BYTES
              value: "3221225472"
            - name: RAY_API_UPLOAD_MAX_CONCURRENT
              value: "1"
            - name: RAY_API_UPLOAD_RATE_LIMIT
              value: "20"
            - name: RAY_API_SPOOL_DIR
              value: "/var/lib/ray-platform/ray-packages"
          volumeMounts:
            - name: ray-api-spool
              mountPath: /var/lib/ray-platform/ray-packages
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: ray-api-spool
          emptyDir:
            sizeLimit: 3Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ray-train-backend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ray-train-platform.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      name: http
  selector:
    app: ray-train-backend
