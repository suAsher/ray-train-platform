{{- $environmentBuilds := .Values.backend.environmentBuilds | default dict }}
{{- if $environmentBuilds.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-train-environment-builds
  namespace: {{ .Values.namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-train-environment-builds
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: ray-train-platform-sa
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ray-train-environment-builds
{{- end }}
