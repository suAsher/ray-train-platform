{{- if .Values.availability.pdbEnabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ray-train-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ray-train-platform.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.availability.minAvailable }}
  selector:
    matchLabels:
      app: ray-train-backend
{{- $release := default (dict) .Values.spkRayjobRelease }}
{{- if (default false $release.enabled) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: spk-rayjob-release
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ray-train-platform.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: spk-rayjob-release
spec:
  minAvailable: {{ .Values.availability.minAvailable }}
  selector:
    matchLabels:
      app: spk-rayjob-release
{{- end }}
{{- end }}
