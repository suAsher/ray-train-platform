namespace: monitoring

nodeSelector: {}

prometheus:
  image: quay.io/prometheus/prometheus:v3.5.0
  replicas: 1
  retention: 90d
  scrapeInterval: 30s
  storage:
    className: ""
    size: 200Gi
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 6Gi

grafana:
  image: docker.io/grafana/grafana:12.1.0
  replicas: 1
  adminSecretName: ray-platform-grafana-admin
  dashboardProvisioningConfigMap: ray-grafana-dashboard-provisioning
  dashboardJSONConfigMap: ray-grafana-dashboard-json
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
