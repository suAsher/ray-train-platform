# Supply your own verified image digests in a separate values file.
nodePathMap:
  - node: "gpu-node-a"
    paths:
      - /data1/ray-cache
      - /data2/ray-cache
  - node: "gpu-node-b"
    paths:
      - /data1/ray-cache
      - /data2/ray-cache

cache:
  allowedRoots: [/data1/ray-cache, /data2/ray-cache]

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
