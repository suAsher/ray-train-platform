{{- if .Values.monitoring.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ray-cache-local.fullname" . }}-monitor
  labels:
    {{- include "ray-cache-local.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache-monitor
spec:
  type: ClusterIP
  selector:
    {{- include "ray-cache-local.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: cache-monitor
  ports:
    - name: metrics
      port: {{ .Values.monitoring.service.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
