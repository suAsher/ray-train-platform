nameOverride: ""
fullnameOverride: ""

# Optional complete ConfigMap in the release namespace, managed outside Helm.
# Clone the legacy <fullname>-config before switching: config.json, setup,
# teardown, helperPod.yaml and collect-cache-metrics must all be present.
# The controller owns only config.json; keep the other keys intact. The chart
# still renders the legacy map so clearing this field restores the Helm config.
# Use a literal DNS subdomain name (max 253 characters), never a template.
existingConfigMap: ""

# Resolve upstream images to verified repository@sha256 references before install.
# Sources: docker.io/rancher/local-path-provisioner:v0.0.36,
# docker.io/library/busybox:1.36.1, quay.io/prometheus/node-exporter:v1.9.1.
# The chart rejects mutable tags; tests/image-fixture.yaml is never for installation.
images:
  provisioner: ""
  helper: ""
  pullPolicy: IfNotPresent

storageClass:
  name: ray-cache-local
  provisioner: rancher.io/local-path
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: false

# Portable defaults deliberately deny all nodes. Cluster profiles must opt in
# exact node names and exact cache roots.
nodePathMap: []

# Exact host roots the helper scripts may create/delete PVC children under.
# Profiles must keep this list identical to the roots in nodePathMap.
cache:
  allowedRoots: []

provisioner:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  preferredNodeSelector:
    raytrain.io/pool: control-plane

monitoring:
  enabled: false
  intervalSeconds: 30
  nodeSelector:
    accelerator: nvidia-rtx-4090
    raytrain.io/gpu-pool: production
  nodeExporter:
    image: ""
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
  collector:
    image: ""
    # Non-root UID with the trusted root-owned cache directory group. The
    # host mounts are exact cache roots and read-only.
    runAsUser: 65534
    runAsGroup: 0
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  service:
    port: 9100
  serviceMonitor:
    enabled: false
    interval: 30s
  prometheusRule:
    enabled: false
