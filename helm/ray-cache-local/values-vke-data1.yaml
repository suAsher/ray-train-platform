fullnameOverride: ray-cache-local-data1

storageClass:
  name: ray-cache-local-data1
  provisioner: wellspiking.ai/local-path-data1
  reclaimPolicy: Delete
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: false

nodePathMap:
  - node: "172.28.1.232"
    paths: [/data1/ray-cache]
  - node: "172.28.1.233"
    paths: [/data1/ray-cache]

# The retained legacy release already exports metrics for both cache roots.
# Enable monitoring here only when that compatibility release is retired.
monitoring:
  enabled: false
