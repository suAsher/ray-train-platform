{{- if .Values.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: node-onboarding-ready-label
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["nodes"]
        scope: Cluster
  variables:
    - name: labels
      expression: "has(object.metadata.labels) ? object.metadata.labels : {}"
    - name: oldLabels
      expression: "oldObject != null && has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}"
  validations:
    - expression: >-
        request.userInfo.username == 'system:serviceaccount:ray-cache-local:node-onboarding' ||
        ((('raytrain.io/cache-ready' in variables.labels) == ('raytrain.io/cache-ready' in variables.oldLabels)) &&
         (!('raytrain.io/cache-ready' in variables.labels) ||
          variables.labels['raytrain.io/cache-ready'] == variables.oldLabels['raytrain.io/cache-ready']))
      message: "Only verified onboarding may add, remove or change cache-ready; other Node management remains allowed"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: node-onboarding-ready-label
spec:
  policyName: node-onboarding-ready-label
  validationActions: [Deny]
{{- end }}
