{{- if .Values.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-onboarding
  namespace: ray-cache-local
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-onboarding-probe
  namespace: ray-cache-local
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-onboarding
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    resourceNames: [{{ .Values.data1StorageClass | quote }}, {{ .Values.data2StorageClass | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: node-onboarding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: node-onboarding
subjects:
  - kind: ServiceAccount
    name: node-onboarding
    namespace: ray-cache-local
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: node-onboarding
  namespace: ray-cache-local
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.data1ConfigMap | quote }}, {{ .Values.data2ConfigMap | quote }}, "node-onboarding-nfs", "node-onboarding-state"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ .Values.data1ConfigMap | quote }}, {{ .Values.data2ConfigMap | quote }}]
    verbs: ["update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["node-onboarding-state"]
    verbs: ["update"]
  - apiGroups: [""]
    resources: ["pods", "persistentvolumeclaims"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["node-onboarding"]
    verbs: ["get", "update"]
  # RBAC cannot constrain CREATE by resourceNames. Admission enforces the name.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: node-onboarding
  namespace: ray-cache-local
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: node-onboarding
subjects:
  - kind: ServiceAccount
    name: node-onboarding
    namespace: ray-cache-local
{{- end }}
