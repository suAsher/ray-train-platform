# Production overlay for immutable dataset versions and managed Ray Data.
#
# Apply only with `helm upgrade --reuse-values`: this file deliberately keeps
# every unrelated production setting out of the rollout.  All new workload
# images are pinned by digest and no TOS credential is stored here.
backend:
  image:
    repository: ray-train-backend
    tag: tos-secret-r5
    digest: sha256:9c046f94bff45f7bf0d11bad4d9b4321ecfbec7c00dc78c29bd01a05238de94a
  datasetVersioningEnabled: true
  rayDataStreamingEnabled: true
  datasetInternalPrefix: ray-train/platform/datasets

frontend:
  image:
    repository: ray-train-frontend
    tag: streaming-20260831-c3457cb
    digest: sha256:c4280f341c7c47f07acbb4ded7b127d3e8691d637fd63dc1ef6e60a6f1953f39

spkRayjobRelease:
  enabled: true
  image:
    repository: spk-rayjob-release
    tag: streaming-20260831-c3457cb
    digest: sha256:922a338155fc9d9468bc3a4d8e6c0041df391e49f1d161ed65f9c5ca6227adf0

rayTrain:
  managedEnabled: true
  managedTenants: []
  # Since backend commit 119fc3b, an empty canary allowlist means every
  # authenticated current and future team.  A non-empty list narrows rollout.
  canaryEnabled: true
  canaryTenants: []
  canaryVersion: "2.58.0"
  runtimeCatalog:
    canaryManagedBEVFusion:
      reference: harbor.wellspiking.ai/guofeng.su/ray-train-bevfusion-ray258@sha256:1547deaa764f19264f14df6013cf68a70bfe5e5a07a5560b2e5c78512956e168
      rayVersion: "2.58.0"
      supportedEngines: ["ray-train"]

datasetPublisher:
  enabled: true
  sourceBucket: shanghai-data-transfer
  targetBucket: shanghai-data-transfer
  endpoint: https://tos-cn-shanghai.ivolces.com
  region: cn-shanghai
  sourceIndexName: .raytrain/trusted-index-v2.pkl
  serviceAccount:
    # Static credentials are selected below, so this IRSA role must stay empty.
    irsaRoleTRN: ""
  credentials:
    # Referenced only by publisher Jobs in ray-train-platform. Tenant training
    # and debug Pods never receive this Secret or its values.
    existingSecret: tos-credentials
  image:
    repository: ray-dataset-publisher
    tag: shard-parallel-r10
    digest: sha256:9be1e1b2f25b9450c5309ed878c2afc3d187dd08a30ee990a0fba58c0550ba92
  imagePullPolicy: ""
  preferredNodeSelector:
    platform.wellspiking.ai/gpu-pool: production
  nodeSelector: {}
  kueue:
    resourceFlavorName: ""
    clusterQueueName: ""
    localQueueName: ""
    cpuQuota: 16
    memoryQuota: 64Gi
    resourceFlavorNodeLabels: {}
  priorityClassName: ""
  priorityValue: -1000
  resources:
    requests:
      cpu: 16
      memory: 64Gi
    limits:
      cpu: 64
      memory: 256Gi
  job:
    backoffLimit: 3
    activeDeadlineSeconds: 604800
    ttlSecondsAfterFinished: 86400
  kubernetesClient:
    maxAttempts: 3
    initialRetryBackoffSeconds: 1
    maximumRetryBackoffSeconds: 30
  manager:
    pollIntervalSeconds: 10
  workingDirectory: /data/output
  tolerations: []

monitoring:
  enabled: true
  namespace: monitoring
  # The cluster already has a platform-wide Ray PodMonitor.  Rendering a
  # second one would duplicate every worker sample.
  podMonitor:
    enabled: false
  prometheusRule:
    enabled: true
    # Keep Helm --reuse-values from re-serializing this integer as scientific
    # notation and producing an unrelated PrometheusRule rollout.
    objectSpillBytesPerSecond: "104857600"
