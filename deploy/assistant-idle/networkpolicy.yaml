apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-idle-default-deny
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-idle-runtime-egress
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: assistant-idle
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: assistant-idle-controller
              app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
      ports:
        - { protocol: TCP, port: 8443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-idle-controller-gate
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: assistant-idle-controller
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: assistant-idle
              app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
      ports:
        - { protocol: TCP, port: 8443 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: PLACEHOLDER_RAYTRAIN_BACKEND_NAMESPACE
          podSelector:
            matchLabels:
              app: ray-train-backend
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8443 }
  egress:
    - to:
        - ipBlock:
            cidr: PLACEHOLDER_RAYTRAIN_BACKEND_HTTPS_CIDR
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock:
            cidr: PLACEHOLDER_KUBERNETES_API_SERVER_CIDR
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-idle-reaper-apiserver
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: assistant-idle-reaper
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock:
            cidr: PLACEHOLDER_KUBERNETES_API_SERVER_CIDR
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: assistant-idle-backend-to-serve-only
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: assistant-idle
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
      raytrain.wellspiking.ai/assistant-role: inference
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: PLACEHOLDER_RAYTRAIN_BACKEND_NAMESPACE
          podSelector:
            matchLabels:
              app: ray-train-backend
              app.kubernetes.io/component: api
      ports:
        - { protocol: TCP, port: 8443 }
