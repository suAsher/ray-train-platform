apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-idle-controller
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
  labels:
    app.kubernetes.io/name: assistant-idle-controller
    app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-idle-controller
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-idle-controller
        app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
    spec:
      imagePullSecrets:
        - name: PLACEHOLDER_IMAGE_PULL_SECRET_NAME
      serviceAccountName: assistant-idle-controller
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: PLACEHOLDER_CONTROLLER_IMAGE@sha256:PLACEHOLDER_64_HEX_DIGEST
          args: ["--config=/etc/assistant-idle/config.json", "--mode=controller", "--listen=:8443"]
          env:
            - name: GOMEMLIMIT
              value: 700MiB
          ports:
            - name: https
              containerPort: 8443
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /etc/assistant-idle
              readOnly: true
            - name: tls
              mountPath: /run/assistant/tls
              readOnly: true
            - name: demand
              mountPath: /run/assistant/demand
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: assistant-idle-config
        - name: tls
          secret:
            secretName: PLACEHOLDER_CONTROLLER_TLS_SECRET_NAME
            defaultMode: 0440
        - name: demand
          secret:
            secretName: PLACEHOLDER_DEMAND_AUTH_SECRET_NAME
            defaultMode: 0440
