apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
resources:
  - namespace.yaml
  - priorityclass.yaml
  - workloadpriorityclass.yaml
  - localqueue.yaml
  - resourcequota.yaml
  - serviceaccounts.yaml
  - rbac-controller.yaml
  - rbac-reaper.yaml
  - service.yaml
  - networkpolicy.yaml
  - deployment-controller.yaml
  - deployment-reaper.yaml
configMapGenerator:
  - name: assistant-idle-config
    files:
      - config.json=config.example.json
