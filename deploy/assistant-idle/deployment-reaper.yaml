apiVersion: apps/v1
kind: Deployment
metadata:
  name: assistant-idle-reaper
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
  labels:
    app.kubernetes.io/name: assistant-idle-reaper
    app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: assistant-idle-reaper
      app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  template:
    metadata:
      labels:
        app.kubernetes.io/name: assistant-idle-reaper
        app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
    spec:
      imagePullSecrets:
        - name: PLACEHOLDER_IMAGE_PULL_SECRET_NAME
      serviceAccountName: assistant-idle-reaper
      automountServiceAccountToken: true
      containers:
        - name: reaper
          image: PLACEHOLDER_CONTROLLER_IMAGE@sha256:PLACEHOLDER_64_HEX_DIGEST
          args: ["--config=/etc/assistant-idle/config.json", "--mode=reaper"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/assistant-idle
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: assistant-idle-config
