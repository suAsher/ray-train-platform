apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: assistant-idle-controller
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
rules:
  # Kubernetes RBAC cannot restrict create by resourceName because the object
  # does not exist yet. This Role is intentionally namespaced to the dedicated
  # assistant namespace; controller code must still enforce the fixed name.
  - apiGroups: ["ray.io"]
    resources: ["rayservices"]
    verbs: ["create"]
  - apiGroups: ["ray.io"]
    resources: ["rayservices"]
    resourceNames: ["PLACEHOLDER_RAYSERVICE_NAME"]
    verbs: ["get", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["PLACEHOLDER_LEASE_NAME"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: assistant-idle-controller
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: assistant-idle-controller
subjects:
  - kind: ServiceAccount
    name: assistant-idle-controller
    namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: assistant-idle-controller-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ray.io"]
    resources: ["rayjobs", "rayclusters"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kueue.x-k8s.io"]
    resources: ["workloads"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["rayservices.ray.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: assistant-idle-controller-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: assistant-idle-controller-readonly
subjects:
  - kind: ServiceAccount
    name: assistant-idle-controller
    namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
