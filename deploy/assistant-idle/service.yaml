apiVersion: v1
kind: Service
metadata:
  name: assistant-idle-controller
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
  labels:
    app.kubernetes.io/name: assistant-idle-controller
    app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: assistant-idle-controller
    app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
  ports:
    - name: https
      port: 8443
      targetPort: https
---
apiVersion: v1
kind: Service
metadata:
  name: assistant-idle-inference
  namespace: PLACEHOLDER_ASSISTANT_NAMESPACE
  labels:
    app.kubernetes.io/name: assistant-idle-inference
    app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
    app.kubernetes.io/component: assistant-idle
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: PLACEHOLDER_INSTANCE_ID
    app.kubernetes.io/component: assistant-idle
    raytrain.wellspiking.ai/assistant-role: inference
  ports:
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
